<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a1c0d">
<title>Nusantara 1350 · Peta Majapahit (Tahap 1)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#f1d38a;--gd:#9c7a3c;--paper:#f6e9c8}
html,body{margin:0;height:100%;overflow:hidden;background:#0d2a3b;font-family:Georgia,serif;color:var(--paper);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0}
canvas#map{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:grab}
.abs{position:absolute}
.wood{background:linear-gradient(180deg,#4a3519 0%,#2b1d0d 100%);border:1.5px solid var(--gd);box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 rgba(255,231,166,.3),0 4px 12px rgba(0,0,0,.5)}
.btn{background:linear-gradient(#5a4220,#2d1f0e);border:1px solid #000;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,231,166,.35);color:var(--gold);cursor:pointer;padding:0;display:grid;place-items:center}
.btn:active{filter:brightness(1.3)}
.btn.on{background:linear-gradient(#f5dc95,#a77c34);color:#2a1a08}
.btn:disabled{opacity:.35;cursor:default}

/* top bar */
#top{left:0;right:0;top:0;height:38px;background:linear-gradient(180deg,#5d4422 0%,#33240f 60%,#22170a 100%);border-bottom:2px solid #b08d45;box-shadow:inset 0 1px 0 #ffe7a6,0 3px 10px rgba(0,0,0,.5);z-index:5;display:flex;align-items:center;padding-left:72px;padding-right:6px;gap:5px}
#crest{position:absolute;left:6px;top:2px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6dc92,#8a6226 75%);border:2px solid #000;box-shadow:0 0 0 2px var(--gd),0 3px 8px rgba(0,0,0,.6);display:grid;place-items:center;z-index:6}
#crest svg{width:40px;height:40px}
.res{display:flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 3px;background:linear-gradient(#2c1f10,#150f08);border:1px solid var(--gd);border-radius:13px;font:600 11px system-ui,sans-serif;white-space:nowrap}
.res i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px Georgia,serif;color:#241607;border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.res i{flex:none}.res i svg{width:14px;height:14px;display:block}.res{color:var(--paper);cursor:pointer}.res:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.res em{font-style:normal;opacity:.55;font-weight:500;font-size:10px}
.sp{flex:1}
#time{display:flex;align-items:center;gap:6px;height:30px;padding:0 5px 0 9px;background:linear-gradient(#2c1f10,#150f08);border:1px solid var(--gd);border-radius:6px}
#time b{color:var(--gold);font-size:12px;white-space:nowrap}
#pause{width:22px;height:22px;border-radius:50%;font-size:9px}
.pips{display:flex;gap:2px}.pips i{width:5px;height:11px;background:#3b2c18;border:1px solid #000}.pips i.on{background:var(--gold)}
#paused{left:50%;top:39px;transform:translateX(-50%);z-index:4;padding:2px 22px;font:700 11px Georgia,serif;letter-spacing:2px;text-transform:uppercase;color:#ffe9c0;background:linear-gradient(#a02c22,#5e1510);border:1.5px solid #e2b865;border-top:0;border-radius:0 0 8px 8px;box-shadow:0 3px 8px rgba(0,0,0,.5)}

/* province window */
#prov{left:6px;top:46px;width:232px;max-height:calc(100% - 54px);z-index:6;overflow:auto;transform:translateX(-120%);transition:transform .25s ease;border-radius:4px}
#prov.open{transform:translateX(0)}
#prov .hd{display:flex;align-items:center;gap:7px;padding:6px 7px;background:linear-gradient(#7a5a26,#43301a);border-bottom:2px solid #000}
#chip{width:20px;height:20px;border:2px solid #000;border-radius:3px;flex:none}
#prov h2{margin:0;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
#prov .sub{font:10px system-ui,sans-serif;opacity:.8}
#x{width:22px;height:22px;margin-left:auto;font-size:11px;border-radius:50%}
.tabs{display:flex;border-bottom:1px solid #000}
.tabs button{flex:1;padding:5px 0;border:0;background:#2b1d0d;font:600 11px system-ui,sans-serif;color:#cdb98a}
.tabs button.on{background:linear-gradient(#5a4220,#3a2912);color:var(--gold)}
.dev{display:flex;justify-content:space-around;padding:6px 4px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(241,211,138,.2)}
.dev div{display:flex;flex-direction:column;align-items:center;font:700 13px system-ui,sans-serif;gap:2px}
.dev i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px Georgia,serif;color:#241607;border:1px solid #000}
.dev small{font:9px system-ui,sans-serif;opacity:.6;font-weight:400}
#prov .r{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;font:11px system-ui,sans-serif;border-bottom:1px solid rgba(241,211,138,.12)}
#prov .r span{opacity:.65}#prov .r b{font-weight:600;text-align:right}
#prov .note{margin:0;padding:6px 9px 8px;font:10px system-ui,sans-serif;opacity:.55;line-height:1.4}

/* View peta: satu dropdown, tanpa minimap. */
#mapviews{right:8px;bottom:8px;z-index:6;max-width:220px}
#mapViewToggle{min-height:38px;padding:7px 13px;font-size:13px}
#mapViewMenu{position:absolute;bottom:46px;right:0;min-width:185px;max-height:calc(100vh - 145px);overflow:auto;padding:5px}
#mapViewMenu[hidden]{display:none}
#mapViewMenu button{display:block;width:100%;min-height:36px;text-align:left;padding:7px 10px;margin:2px 0;font-size:12px}
#mapLegend{font:10px/1.4 system-ui,sans-serif;padding:7px;color:#efd9a0}
#rightControls{right:6px;top:50%;transform:translateY(-60%);display:flex;flex-direction:column;gap:4px;z-index:4}
#rightControls button{width:30px;height:30px;border-radius:50%;font-size:16px}
#hint{left:50%;bottom:8px;transform:translateX(-50%);font:11px system-ui,sans-serif;background:rgba(15,9,3,.78);padding:5px 10px;border-radius:5px;border:1px solid rgba(156,122,60,.6);transition:opacity .6s;pointer-events:none;z-index:3;white-space:nowrap}
#hint.gone{opacity:0}

/* phase toggles */
#app[data-phase=start] #top,#app[data-phase=start] #rail,#app[data-phase=start] #paused,#app[data-phase=start] #mapviews,#app[data-phase=start] #crest{display:none}
#app[data-phase=game] #start{display:none}
#app[data-phase=start] #rightControls{top:50px;transform:none}
#start{position:absolute;inset:0;pointer-events:none;z-index:7}
#start>*{pointer-events:auto}
#stTitle{left:50%;top:6px;transform:translateX(-50%);padding:5px 26px 6px;text-align:center;background:linear-gradient(#6b4f22,#33240f);border:2px solid #b08d45;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.55)}
#stTitle b{display:block;color:var(--gold);font-size:15px;letter-spacing:3px}
#stTitle small{font:10px system-ui,sans-serif;opacity:.8}
#stPanel[hidden]{display:none}#stPanelToggle{left:6px;bottom:6px;z-index:8;padding:8px 12px;min-height:38px}#stPanel{left:6px;top:6px;width:236px;max-height:calc(100% - 62px);overflow:auto;border-radius:4px}
#stPanel .hd{display:flex;gap:9px;align-items:center;padding:8px;background:linear-gradient(#7a5a26,#43301a);border-bottom:2px solid #000}
#stFlag{width:38px;height:38px;border:2px solid #000;border-radius:5px;display:grid;place-items:center;color:#fff3cf;font-size:18px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
#stPanel h2{margin:0;font-size:16px;color:var(--gold);text-transform:uppercase;letter-spacing:.8px}
#stPanel .sub{font:10px system-ui,sans-serif;opacity:.8}
#stPanel .r{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;font:11.5px system-ui,sans-serif;border-bottom:1px solid rgba(241,211,138,.12)}
#stPanel .r span{opacity:.65}#stPanel .r b{text-align:right}
.stars{color:var(--gold);letter-spacing:2px}
#btnStart{right:6px;bottom:6px;width:138px;height:44px;font:700 14px Georgia,serif;letter-spacing:1px;color:#2a1a08;background:linear-gradient(#f5dc95,#a77c34);border:2px solid #000;border-radius:6px;cursor:pointer;box-shadow:inset 0 1px 0 #fff3c0,0 4px 12px rgba(0,0,0,.6)}
#btnStart:disabled{opacity:.4;filter:grayscale(.6)}
.mini-btn{margin:7px 9px;padding:6px 10px;font:600 11px system-ui,sans-serif;width:calc(100% - 18px)}

/* rail + windows */
#rail{left:6px;top:66px;display:flex;flex-direction:column;gap:4px;z-index:5}
#rail button{width:32px;height:32px;font-size:15px;border-radius:5px}
#rail{gap:3px}#rail button.red{background:linear-gradient(#a02c22,#5e1510);color:#ffe9c0}
#modal{inset:0;display:none;place-items:center;z-index:20;background:rgba(0,0,0,.5)}#modal.open{display:grid}
.mbox{width:min(300px,86%);background:linear-gradient(#4a3519,#2b1d0d);border:2px solid #b08d45;border-radius:6px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.7);font:12px system-ui,sans-serif;color:#f1e3c1}
.mbox h3{margin:0 0 6px;font:700 15px Georgia,serif;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}.mbox p{margin:0 0 10px;line-height:1.45}
.mbox .mo{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mbox .mo button{padding:6px 12px;font:600 12px system-ui,sans-serif;border-radius:4px}
.rowb{display:flex!important;justify-content:space-between;align-items:center;gap:6px;width:100%;box-sizing:border-box;padding:6px 9px;border-radius:0;font:11.5px system-ui,sans-serif;text-align:left;border-width:0 0 1px;border-color:rgba(241,211,138,.15)}
.rowb em{font-style:normal;opacity:.75;font-size:10.5px;text-align:right}.rowb.on{background:linear-gradient(#6b5a22,#3d3114)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid #000;vertical-align:-1px}
.sb{position:relative;width:110px;height:14px;background:linear-gradient(90deg,#7a2418,#7a2418 50%,#2f6a2c 50%);border:1px solid #000;border-radius:3px;overflow:hidden}
.sb i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.0);border-right:2px solid #ffe9a0}.sb b{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;text-shadow:0 0 3px #000;color:#fff}
#win{left:46px;top:44px;width:240px;max-height:calc(100% - 52px);z-index:6;overflow:auto;transform:translateX(-130%);transition:transform .25s ease;border-radius:4px}
#win.open{transform:translateX(0)}
#win .hd{display:flex;align-items:center;gap:7px;padding:6px 7px;background:linear-gradient(#7a5a26,#43301a);border-bottom:2px solid #000;position:sticky;top:0;z-index:2}
#win h2{margin:0;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
#win .sub{font:10px system-ui,sans-serif;opacity:.8}
#win .r{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;font:11.5px system-ui,sans-serif;border-bottom:1px solid rgba(241,211,138,.12);align-items:center}
#win .r span{opacity:.7}#win .r b{font-weight:600;text-align:right}
#win .sec{padding:4px 9px;font:700 10px system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;background:rgba(0,0,0,.3);color:var(--gold)}
#win .note{margin:0;padding:6px 9px 8px;font:10px system-ui,sans-serif;opacity:.55;line-height:1.4}
.pos{color:#9fe08a}.neg{color:#ff9a8a}
.ab{padding:4px 8px;font:600 10.5px system-ui,sans-serif;min-height:26px;white-space:nowrap}
.dev{display:flex;justify-content:space-around;padding:6px 4px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(241,211,138,.2)}
.dev div{display:flex;flex-direction:column;align-items:center;font:700 13px system-ui,sans-serif;gap:2px}
.dev i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px Georgia,serif;color:#241607;border:1px solid #000}
.dev small{font:9px system-ui,sans-serif;opacity:.6;font-weight:400}
.bar{height:6px;background:#150f08;border:1px solid #000;margin:2px 0 0;border-radius:3px;overflow:hidden;width:70px}.bar>i{display:block;height:100%;background:var(--gold)}
#win,#stPanel{scrollbar-width:thin;scrollbar-color:#9c7a3c #1a1208}
#toasts{right:44px;top:44px;display:flex;flex-direction:column;gap:5px;z-index:8;pointer-events:none;align-items:flex-end}
.toast{max-width:230px;padding:6px 10px;font:11.5px system-ui,sans-serif;background:linear-gradient(#4a3519,#2b1d0d);border:1.5px solid var(--gd);border-left:4px solid var(--gold);border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.5);animation:ti .25s ease}
@keyframes ti{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#speed{display:flex;align-items:center;gap:3px}
#speed .pip{width:9px;height:18px;padding:0;background:#3b2c18;border:1px solid #000;border-radius:1px;cursor:pointer}
#speed .pip.on{background:var(--gold)}
.spd{width:20px;height:20px;font-size:12px;border-radius:50%}
@media (max-width:899px){.res.opt{display:none}}

<script>
const DATA = __MAP__;
const EAST_ASIA = __EAST_ASIA__, EAST_PROFILE=EAST_ASIA.profiles;
const app = document.getElementById('app');
const cvs = document.getElementById('map'), mainCtx = cvs.getContext('2d');
let ctx = mainCtx;
const WATER = '#14405a', WATER_T = '#17475f';
const COL = { core:'#c04a36', vassal:'#e8b68a', rival:'#5f93b8' };
const TERR = { plains:'#9aaa58', jungle:'#3d6b3a', mountain:'#86714f', coast:'#c4b77a', sea:WATER };
const TERR_TXT = { plains:'Dataran', jungle:'Hutan lebat', mountain:'Pegunungan', coast:'Pesisir', sea:'Perairan' };
const ST_TXT = { core:'Inti Majapahit', vassal:'Mitra / tributari', rival:'Rival', indep:'Merdeka', foreign:'Kerajaan asing', sea:'Perairan' };
const WW = DATA.W, WH = DATA.H;
const provs = DATA.provinces.map(p => ({ ...p, path: new Path2D(p.d) }));
const nats = DATA.nations.map(n => ({ nat:n.nat, path:new Path2D(n.d) }));
const coast = new Path2D(DATA.coast);
const rivers = DATA.rivers.map(d => new Path2D(d)), lakes = DATA.lakes.map(d => new Path2D(d));

const byName = n => provs.find(p => p.n === n);
const hueOf = s => { let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360; };
function natCol(nat) {
  if (nat === 'Majapahit') return COL.core; if (nat === 'Sunda') return COL.rival;
  let h = hueOf(nat); if (h < 28 || h > 335) h = (h + 70) % 360; if (h > 195 && h < 228) h = (h + 50) % 360;
  return `hsl(${h},46%,60%)`;
}
const natColor = {}; provs.forEach(p => { if (p.k === 'L' && !natColor[p.nat]) natColor[p.nat] = natCol(p.nat); });
const BASE_OWN = Object.fromEntries(provs.filter(p => p.k === 'L').map(p => [p.id, p.nat]));
let OWNR = { ...BASE_OWN }, CTRL = {};
function polFillRaw(p) { return p.k === 'S' ? WATER : (mode==='pol'||phase==='start'?natColor[OWNR[p.id]]||'#888':mapFilterColor(p)); }
function polFill(p) { return p._pf || (p._pf = polFillRaw(p)); }
const HATCH = {};
function hatchFor(col) {
  if (HATCH[col]) return HATCH[col];
  const c = document.createElement('canvas'); c.width = c.height = 12; const g = c.getContext('2d');
  g.strokeStyle = col; g.globalAlpha = .85; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-3, 12); g.lineTo(12, -3); g.moveTo(-3, 3); g.lineTo(3, -3); g.moveTo(9, 15); g.lineTo(15, 9); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.globalAlpha = 1; g.lineWidth = .8; g.beginPath(); g.moveTo(-3, 13); g.lineTo(13, -3); g.stroke();
  return HATCH[col] = ctx.createPattern(c, 'repeat');
}

let phase = 'start', selNat = null, G = null;
let rot = false, vw = 800, vh = 360, dpr = 1, minS = .3, maxS = 8, fitS = .3, raf = 0, inited = false;
let view = { s:1, tx:0, ty:0 }, mode = 'pol', selId = null;
const pat = {};

function toLocal(x, y) { return rot ? { x:y, y:window.innerWidth - x } : { x, y }; }

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  rot = H > W;
  vw = rot ? H : W; vh = rot ? W : H;
  app.style.width = vw + 'px'; app.style.height = vh + 'px';
  app.style.transform = rot ? `translateX(${W}px) rotate(90deg)` : 'none';
  // Batas backing store mengikuti layar, tidak ikut luas peta.
  dpr = Math.min(window.devicePixelRatio || 1, matchMedia('(pointer:coarse)').matches ? 1.5 : 1.75, Math.sqrt(1500000/(vw*vh)));
  cvs.style.width = vw + 'px'; cvs.style.height = vh + 'px';
  const bw=Math.round(vw*dpr),bh=Math.round(vh*dpr);
  if(cvs.width!==bw)cvs.width=bw;if(cvs.height!==bh)cvs.height=bh;
  fitS = Math.min(vw/WW, vh/WH); minS = fitS*.9; maxS = Math.max(6,fitS*12);
}
const clampS = s => Math.min(maxS, Math.max(minS, s));
function clampView() {
  const mw = WW*view.s, mh = WH*view.s, m = 40;
  view.tx = mw <= vw ? (vw-mw)/2 : Math.min(m, Math.max(vw-mw-m, view.tx));
  view.ty = mh <= vh ? (vh-mh)/2 : Math.min(m, Math.max(vh-mh-m, view.ty));
}
function centerOn(wx, wy, s) { view.s = clampS(s); view.tx = vw/2 - wx*view.s; view.ty = vh/2 - wy*view.s; clampView(); request(); }
function zoomAt(x, y, ns) { ns = clampS(ns); const wx=(x-view.tx)/view.s, wy=(y-view.ty)/view.s; view.s = ns; view.tx = x-wx*ns; view.ty = y-wy*ns; clampView(); request(); }
const home = () => Math.max(fitS*1.5, vw/(WW*.4));
function request() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

function makePatterns() {
  const mk = (n, f) => { const c = document.createElement('canvas'); c.width = c.height = n; f(c.getContext('2d')); return ctx.createPattern(c, 'repeat'); };
  pat.noise = mk(128, c => { for (let i=0;i<4200;i++){ c.fillStyle = Math.random()<.5?'rgba(0,0,0,.26)':'rgba(255,240,200,.16)'; c.fillRect(Math.random()*128,Math.random()*128,1.4+Math.random(),1.4+Math.random()); }});
  pat.water = mk(96, c => { for (let i=0;i<800;i++){ c.fillStyle = 'rgba(150,215,240,'+(Math.random()*.10).toFixed(3)+')'; c.fillRect(Math.random()*96,Math.random()*96,2,1); }});
  pat.grain = mk(128, c => { for (let i = 0; i < 1500; i++) { c.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.6)' : 'rgba(255,246,222,.55)'; c.fillRect((Math.random()*128)|0, (Math.random()*128)|0, 1, 1); } });
  pat.hatch = mk(14, c => { c.strokeStyle='rgba(60,18,8,.35)'; c.lineWidth=2; c.beginPath(); c.moveTo(-3,14); c.lineTo(14,-3); c.moveTo(-3,3); c.lineTo(3,-3); c.moveTo(11,17); c.lineTo(17,11); c.stroke(); });
}

const placed = [];
function fits(x, y, w, h) {
  const r = [x-w/2, y-h/2, x+w/2, y+h/2];
  for (const q of placed) if (r[0]<q[2] && r[2]>q[0] && r[1]<q[3] && r[3]>q[1]) return false;
  placed.push(r); return true;
}
function label(t, x, y, fs, font, fill, halo, ls) {
  ctx.font = font; if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(t).width;
  if (!fits(x, y, w + 4, fs + 3)) return false;
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.6; ctx.strokeStyle = halo; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y); return true;
}
function peaks(x, y, s) {
  const k = Math.min(1, Math.max(.6, s*1.6));
  ctx.fillStyle = 'rgba(66,45,24,.85)'; ctx.strokeStyle = 'rgba(255,236,190,.5)'; ctx.lineWidth = .8;
  for (const [dx,dy,r] of [[-8,4,1],[1,1,1.25],[9,6,.9]]) {
    const px=x+dx*k, py=y+dy*k, z=5*k*r;
    ctx.beginPath(); ctx.moveTo(px-z,py+z*.6); ctx.lineTo(px,py-z); ctx.lineTo(px+z,py+z*.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function counter(x, y, txt, color) {
  const w = 24, h = 14;
  ctx.fillStyle = '#000'; ctx.fillRect(x-w/2-1.5, y-h/2-1.5, w+3, h+3);
  const g = ctx.createLinearGradient(0,y-h/2,0,y+h/2); g.addColorStop(0,'#f1d38a'); g.addColorStop(1,'#9c7a3c');
  ctx.fillStyle = g; ctx.fillRect(x-w/2-.5, y-h/2-.5, w+1, h+1);
  ctx.fillStyle = color; ctx.fillRect(x-w/2+1.5, y-h/2+1.5, 8, h-3);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui,sans-serif'; if ('letterSpacing' in ctx) ctx.letterSpacing='0px';
  ctx.textAlign = 'center'; ctx.fillText(txt, x+4, y+.5);
}

/* ===== tekstur medan & air (dibuat sekali saat memuat) ===== */
const TEX = { land:null, water:null, ready:false };
// Tekstur dekoratif dibatasi satu megapiksel; detail geometri tetap pada resolusi layar.
const TK = Math.min(1.2,Math.sqrt(1000000/(WW*WH)));
const LANDC = { plains:'#8fae55', jungle:'#43723a', mountain:'#86714f', coast:'#b8b479' };
const PERM = new Uint8Array(512), GR = new Float32Array(256);
function rng(seed) { let a = seed >>> 0; return () => (a = (a*1664525 + 1013904223) >>> 0) / 4294967296; }
(() => { const r = rng(7), p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (r()*(i+1))|0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; for (let i = 0; i < 256; i++) GR[i] = r(); })();
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
  const a = GR[PERM[X + PERM[Y]]], b = GR[PERM[X + 1 + PERM[Y]]], c = GR[PERM[X + PERM[Y + 1]]], d = GR[PERM[X + 1 + PERM[Y + 1]]];
  const u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);
  return a + (b - a)*u + (c - a)*v + (a - b - c + d)*u*v;
}
function fbm(x, y) { let a = .5, f = 1, s = 0; for (let o = 0; o < 5; o++) { s += a*vn(x*f, y*f); f *= 2.03; a *= .5; } return s; }
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ===== tekstur: hanya hitung piksel daratan, noise dipakai ulang ===== */
function buildTextures() {
  const tw = Math.round(WW*TK), th = Math.round(WH*TK);
  const lw = Math.round(tw/9), lh = Math.round(th/9);
  const lo = mkc(lw, lh), lx = lo.getContext('2d'), mo = mkc(lw, lh), mx = mo.getContext('2d');
  for (const c of [lx, mx]) c.scale(lw/WW, lh/WH);
  lx.fillStyle = '#8c9a5c'; lx.fillRect(0, 0, WW, WH); mx.fillStyle = '#000'; mx.fillRect(0, 0, WW, WH);
  for (const p of provs) if (p.k === 'L') {
    lx.fillStyle = lx.strokeStyle = LANDC[p.t] || '#888'; lx.fill(p.path); lx.lineWidth = 3; lx.stroke(p.path);
    mx.fillStyle = mx.strokeStyle = p.t === 'mountain' ? '#f00' : p.t === 'jungle' ? '#0f0' : '#000'; mx.fill(p.path); mx.lineWidth = 3; mx.stroke(p.path);
  }
  // warna medan (frekuensi rendah, dipakai di mode Medan)
  const tc = mkc(tw, th), tx = tc.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(lo, 0, 0, tw, th);
  tx.globalCompositeOperation = 'destination-in'; tx.save(); tx.scale(tw/WW, th/WH); tx.fill(coast, 'evenodd'); tx.restore();
  TEX.tint = tc;
  const mc = mkc(tw, th), mcx = mc.getContext('2d'); mcx.imageSmoothingQuality = 'high'; mcx.drawImage(mo, 0, 0, tw, th);
  const lmC = mkc(tw, th), lmx = lmC.getContext('2d'); lmx.scale(tw/WW, th/WH); lmx.fillStyle = '#000'; lmx.fill(coast, 'evenodd');
  const lm = lmx.getImageData(0, 0, tw, th).data, md = mcx.getImageData(0, 0, tw, th).data;
  // Lepaskan backing store sementara segera, jangan menunggu GC pada HP.
  for(const c of [lo,mo,mc,lmC])c.width=c.height=1;
  TEX.lm = new Uint8Array(tw*th); for (let i = 0; i < tw*th; i++) TEX.lm[i] = lm[i*4 + 3];
  TEX.tw = tw; TEX.th = th;
  const bc = mkc(tw, th), bx = bc.getContext('2d'), img = bx.createImageData(tw, th), d = img.data;
  const H = new Float32Array(tw*th), MOT = new Float32Array(tw*th), JV = new Float32Array(tw*th);
  const F = .022, F1 = F*2.03, F2 = F1*2.03, F3 = F2*2.03;
  for (let y = 0, i = 0; y < th; y++) for (let x = 0; x < tw; x++, i++) {
    if (lm[i*4 + 3] < 8) continue;
    const m = md[i*4]/255, j = md[i*4 + 1]/255;
    const a0 = vn(x*F, y*F), a1 = vn(x*F1, y*F1), a2 = vn(x*F2, y*F2), a3 = vn(x*F3, y*F3);

function mkArmy(nat, regs, loc) { const a = { id:G.nid++, nat, regs, loc, path:[], prog:0, morale:1, drill:0, drilling:false }; G.armies.push(a); return a; }

/* ---------- AI pasukan ---------- */
function repairBattleLocks() {

    const A=sideArmies(bt,'A'),B=sideArmies(bt,'B');
    if(!A.some(a=>B.some(b=>atWar(a.nat,b.nat))))endBattle(bt,null);
  }
  const active=new Set((G.battles||[]).filter(b=>!b.done).map(b=>b.id));

function aiReturnHome(a) {

  const nats = Object.keys(NATS).filter(n => alive(n) && !isMe(n));

    const atw = warsOf(n).length > 0, fl = Math.round(aiFl(n)*(atw ? 1.4 : 1)), have = regsOf(n);
    if (have < fl && Math.random() < (atw ? .8 : .35)) {
      const h = capOf(n); if ((CTRL[h.id] && CTRL[h.id] !== n) || G.armies.some(x => x.loc === h.id && atWar(n, x.nat))) continue;
      const idle = G.armies.find(a => a.nat === n && a.loc === h.id && !a.path.length && !a.bt && !a.exiled);
      if (idle) recruitReady(idle); else {const a=mkArmy(n,1,h.id);a.morale=.5;}
    }

  // gabung pasukan menganggur di provinsi sama

  if (activeAIWars >= 5) return;
  for (const n of nats) {
    if (G.subj[n] || warsOf(n).length || overextension(n)>80 || aeOf(n)>=50 || Object.values(G.expansion||{}).some(x=>x.owner===n&&x.revolt)) continue;
    const neigh = new Set(); for (const id of OWNED[n]) for (const l of LINK[id]) { const o = OWNR[l.to]; if (o !== n) neigh.add(o); }
    const mine = powerOf(armiesOf(n), capOf(n).id, false);
    for (const t of neigh) {
      if (!alive(t) || (G.subj[t]&&truceLeft(n,G.subj[t])) || subjectMaster(n)===t || subjectMaster(t)===n || allied(n, t) || married(n, t) || truceLeft(n, t) > 0 || G.subj[t] === n || warsOf(t).length > 1) continue;
      if (t === G.nat && monthIdx() < 24) continue;

function canDeclare(t) {

  const defender=G.subj[t]||t;
  if(defender===G.nat)return 'Bawahan Anda';
  if(defender!==t&&(allied(G.nat,defender)||truceLeft(G.nat,defender)>0||atWar(G.nat,defender)))return 'Penguasa target terikat aliansi, gencatan, atau perang yang sudah berjalan';
  if (allied(G.nat, t)) return 'Sekutu';
  if(G.subj[G.nat])return 'Vasal tidak dapat memulai perang sendiri';
  if((G.tributaries||{})[t]===G.nat || (G.tributaries||{})[G.nat]===t)return 'Putuskan hubungan upeti dahulu';
  if (G.subj[t] === G.nat) return 'Vasal Anda';

}

/* ---------- map interaction ---------- */
function onMapTap(p, x, y) {
  if (phase === 'start') { if (p && p.k === 'L') selectNation(OWNR[p.id]); return; }
  const bh = BT_HIT.slice().reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
  if (bh) { bpOpen(bh.bt.id, true); return; }
  const hit = ARM_HIT.slice().reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
  if (hit && isMe(hit.a.nat)) { if (G.sel === hit.a.id) deselectArmy(); else selectArmy(hit.a.id); return; }
  if(handleFleetTap(p,x,y))return;
  if (G.sel && p && p.k === 'L') {
    const a = G.armies.find(z => z.id === G.sel);
    if (a && p.id === a.loc && !a.path.length) { deselectArmy(); return; }
    if (a && (p.id !== a.loc || a.path.length)) { orderMove(a, p.id); renderWin(); request(); return; }
  }
  if (p) { G.sel = null; selId = p.id; winMode = 'prov'; winProv = p.id; renderWin(); request(); }
  else { G.sel = null; winMode = null; selId = null; renderWin(); request(); }
}

/* ---------- Tahap C: agama ---------- */
const RELS = {chinese:{n:'Tradisi Tionghoa',g:'sinic'},vajra:{n:'Buddha Vajrayana',g:'dharma'},japanese:{n:'Shinto-Buddha',g:'dharma'},ryukyu:{n:'Tradisi Ryukyu',g:'pagan'},ainu:{n:'Tradisi Ainu',g:'pagan'},
  siwa:{ n:'Siwa-Buddha', g:'dharma' }, hindu:{ n:'Hindu', g:'dharma' }, mahayana:{ n:'Buddha Mahayana', g:'dharma' },
  thera:{ n:'Buddha Theravada', g:'dharma' }, islam:{ n:'Islam Sunni', g:'muslim' }, animis:{ n:'Animisme', g:'pagan' },
};
function relKey(s) {const east={'Tradisi Tionghoa':'chinese','Buddha Vajrayana':'vajra','Shinto-Buddha':'japanese','Tradisi Ryukyu':'ryukyu','Tradisi Ainu':'ainu'};if(east[s])return east[s]; s = s || ''; return s.startsWith('Siwa') ? 'siwa' : s.startsWith('Hindu') ? 'hindu' : s === 'Buddha Mahayana' ? 'mahayana' : s === 'Buddha Theravada' ? 'thera' : s.startsWith('Islam') ? 'islam' : 'animis'; }
function fixRel() {
  if (!G.pr) { G.pr = {}; for (const p of provs) if (p.k === 'L') G.pr[p.id] = initialEastReligion(p); }
  G.rs ||= relKey(NATS[G.nat].relig);
  if (relKey(NATS[G.nat].relig) !== G.rs) NATS[G.nat].relig = RELS[G.rs].n;
  G.miss ||= []; G.inst ||= {}; G.ideas ||= []; G.evx ||= {};
}
function initialEastReligion(p){return p.n==='Tibet Timur'?'vajra':p.n==='Tamna'?'mahayana':relKey(EAST_PROFILE[p.nat]?.provinceRel||RELIG[p.nat]);}
const relOf = id => (G.pr && G.pr[id]) || 'animis';
const relName = id => RELS[relOf(id)].n;
const tolTrue = () => 3 + (G.rs === 'siwa' || G.rs === 'hindu' ? 1 : 0) + modSum('tolT');
const tolHeretic = () => (G.rs === 'siwa' ? 1 : 0) + modSum('tolH');
const tolHeathen = () => -1 + modSum('tolN');
function tolOf(k) { return k === G.rs ? tolTrue() : RELS[k].g === RELS[G.rs].g ? tolHeretic() : tolHeathen(); }
function relFac(id) { if (!G || !G.pr) return 1; const k = relOf(id); if (k === G.rs) return 1; const t = tolOf(k); return t < 0 ? Math.max(.5, 1 + .1*t) : 1; }
function unity() {
  let a = 0, b = 0;
  for (const id in G.pv) {
    if (CTRL[id] && CTRL[id] !== G.nat) continue;
    const d = provDev(id), k = relOf(id); let c = 1;
    if (k !== G.rs) { const t = tolOf(k); c = t < 0 ? 0 : t === 0 ? .25 : t <= 1 ? .5 : t <= 2 ? .75 : 1; }
    a += d*c; b += d;
  }
  return b ? Math.round(100*a/b) : 100;
}
const stabCost = () => Math.round(100 * (1 + (100 - unity())/100));
function unrestOf(id) {
  if(G.expansion?.[id])return conquestUnrest(id);
  const k = relOf(id); let u = 0;
  if (k !== G.rs) { const t = tolOf(k); u = t < 0 ? -t*1.25 : 0; }
  if (G.miss.some(m => m.pid === id)) u += 6;
  return Math.round(u*10)/10;
}
const misMaxR = () => 1 + (NATS[G.nat].ruler.a >= 5 ? 1 : 0);
const misStr = () => 2 + .5*Math.max(0, G.stab) + modSum('misn');
function sendMiss(id) {
  if (!G.pv[id] || relOf(id) === G.rs || G.miss.length >= misMaxR() || G.miss.some(m => m.pid === id)) return;
  G.miss.push({ pid:id, p:0 }); toast(`Misionaris dikirim ke ${PROV[id].n}.`);
}
function relRow(id) {
  const k = relOf(id); let st = '';
  if (G && G.pv[id]) st = k === G.rs ? ' · iman negara' : RELS[k].g === RELS[G.rs].g ? ' · bidaah' : ' · kafir';
  return row('Agama', RELS[k].n + st) + (G && G.pv[id] && k !== G.rs ? row('Keresahan', unrestOf(id)) : '');
}
function missRow(id) {
  if (relOf(id) === G.rs) return '';
  const m = G.miss.find(x => x.pid === id);
  if (m) return `<div class="r"><span>Misionaris · ${Math.floor(m.p)}%</span>${btn('Tarik', 'unmiss', { id })}</div>`;
  return `<div class="r"><span>Misionaris ${G.miss.length}/${misMaxR()} · +${misStr().toFixed(1)}%/bln</span>${btn('Kirim', 'miss', { id }, G.miss.length < misMaxR())}</div>`;
}
function chRel(k) {
  if (!RELS[k] || k === G.rs || G.mana[0] < 150) return;
  if (!Object.keys(G.pv).some(id => relOf(id) === k)) return;
  G.mana[0] -= 150; G.rs = k; NATS[G.nat].relig = RELS[k].n; G.miss = [];
  EF.stab(-2); addMod('chrel', 'Perubahan keyakinan', 24, { tax:-.10 });
  toast(`Agama negara kini ${RELS[k].n}.`); addLog(`Agama negara berganti menjadi ${RELS[k].n}.`);
}
function relMonth() {
  for (const m of G.miss.slice()) {
    if (!G.pv[m.pid] || relOf(m.pid) === G.rs) { G.miss.splice(G.miss.indexOf(m), 1); continue; }
    m.p += misStr() + (RELS[relOf(m.pid)].g === RELS[G.rs].g ? 1 : 0);
    if (m.p >= 100) { G.pr[m.pid] = G.rs; G.miss.splice(G.miss.indexOf(m), 1); toast(`${PROV[m.pid].n} kini memeluk ${RELS[G.rs].n}.`); addLog(`${PROV[m.pid].n} berpindah ke ${RELS[G.rs].n}.`); }
  }

}
function relHTML() {
  const un = unity(), tt = tolTrue(), th = tolHeretic(), tn = tolHeathen(), sg2 = v => (v >= 0 ? '+' : '') + v;
  let h = hd('Agama', RELS[G.rs].n) + `<div class="sec">Toleransi</div>` + row('Iman sendiri', sg2(tt)) + row('Bidaah (satu rumpun)', sg2(th)) + row('Kafir (lain rumpun)', sg2(tn))
    + `<div class="sec">Kesatuan agama</div>` + row('Kesatuan', un + '%') + row('Biaya stabilitas', '+' + (100 - un) + '%') + `<div class="sec">Penganut (perkembangan)</div>`;
  const by = {}; for (const id in G.pv) { if (CTRL[id] && CTRL[id] !== G.nat) continue; const k = relOf(id); by[k] = (by[k] || 0) + provDev(id); }
  for (const k in by) h += row(RELS[k].n + (k === G.rs ? ' ★' : ''), by[k]);
  h += `<div class="sec">Misionaris ${G.miss.length}/${misMaxR()}</div>`;
  for (const m of G.miss) h += `<div class="r"><span>${PROV[m.pid].n}</span><b>${Math.floor(m.p)}%</b></div>`;
  if (!G.miss.length) h += `<p class="note">Kirim dari jendela provinsi yang agamanya berbeda.</p>`;
  const ch = Object.keys(by).filter(k => k !== G.rs);
  if (ch.length) { h += `<div class="sec">Ganti agama negara</div>`; for (const k of ch) h += `<div class="r"><span>Jadi ${RELS[k].n}</span>${btn('150 ADM', 'chrel', { k }, G.mana[0] >= 150)}</div>`; }
  return h + `<p class="note">Toleransi negatif memotong pajak & produksi provinsi 10% per poin. Keresahan (+6 saat ada misionaris) baru memicu pemberontak di tahap berikutnya.</p>`;
}

const TL_MAX = 32;

function fixSubjects() {
  G.subj ||= {}; G.tributaries ||= {}; G.subjectData ||= {};
  for(const n of Object.keys(G.subj)) if(!alive(n)||!alive(G.subj[n])) delete G.subj[n];
  for(const n of Object.keys(G.tributaries)) if(G.subj[n]||!alive(n)||!alive(G.tributaries[n])) delete G.tributaries[n];
  for(const n of [...Object.keys(G.subj),...Object.keys(G.tributaries)]) G.subjectData[n] ||= {since:monthIdx(),extra:0,trust:50,tribute:'cash',lastYear:G.y,scutage:false};
  for(const n of Object.keys(G.subjectData)) if(!G.subj[n]&&!G.tributaries[n])delete G.subjectData[n];
}

function setSubject(n,o,type,age=0) {

}

  const relative=(ownPower*.75+pool*.25)/Math.max(1,regsOf(o)+natDev(o)*.05);
  const extra=meta.extra || 0, trust=meta.trust ?? 50;
  return lim(Math.round(15+40*relative-relGet(n,o)*.15+(v?0:(50-trust)*.4)+extra),0,100);
}
const vassalTaxBase = n => (OWNED[n]||[]).reduce((s,id)=>s+((CTRL[id] && CTRL[id]!==n)?0:baseDev(PROV[id])[0]*.09),0);
function subjectBudget(e) {

  e.subjectTax=G.subj[G.nat] && libertyDesire(G.nat)<50 ? e.tax*.1*(G.subjectData[G.nat]?.scutage?1.5:1):0;
  const drilling=myArmies().filter(a=>a.drilling).reduce((s,a)=>s+a.regs,0)/Math.max(1,G.regs);
  e.armyCost*=.5+.5*G.maintenance+.25*drilling;

  e.supplyCost=G.resourceStocks?.[G.nat]?.food<=0?e.armyCost*.2:0;
  e.net=e.tax+e.prod+e.trade+e.vassalIncome-e.subjectTax-e.armyCost-e.misCost-e.interest-e.supplyCost-e.navalCost;

/* ---------- Tahap G: jaringan dagang terarah ---------- */
const TRADE_NODES = [
 {id:'nippon',n:'Kepulauan Jepang',out:['hangzhou']},{id:'korea',n:'Semenanjung Korea',out:['hangzhou']},{id:'hangzhou',n:'Pesisir Tiongkok',out:['siam','malaka']},
 {id:'maluku',n:'Maluku',out:['sulawesi','jawa']},
 {id:'sulawesi',n:'Sulawesi',out:['jawa']},
 {id:'borneo',n:'Kalimantan',out:['jawa','malaka']},
 {id:'siam',n:'Siam–Champa',out:['malaka']},
 {id:'sumatra',n:'Sumatra',out:['malaka']},
 {id:'jawa',n:'Laut Jawa',out:['malaka']},
 {id:'malaka',n:'Selat Malaka',out:[]},
];
const TRADE_BY_ID=Object.fromEntries(TRADE_NODES.map(n=>[n.id,n]));
function tradeNode(p) {
 const n=p.nat;if(EAST_PROFILE[n])return ['japan','ainu'].includes(EAST_PROFILE[n].region)?'nippon':EAST_PROFILE[n].region==='korea'?'korea':['china','taiwan','ryukyu'].includes(EAST_PROFILE[n].region)?'hangzhou':'siam';
 if(['Bintan','Tumasik','Pahang','Kelantan','Kadaram','Langkasuka'].includes(n))return 'malaka';
 if(['Siam','Khmer','Champa','Tenasserim'].includes(n))return 'siam';
 if(['Minahasa','Gorontalo','Luwu','Makassar','Konawe','Banggai','Buton','Visayas','Mindanao','Sulu'].includes(n))return 'sulawesi';
 if(REGIONAL_STYLE.borneo.includes(n))return 'borneo';
 if(REGIONAL_STYLE.sumatra.includes(n))return 'sumatra';
 if(['Maloko','Halmahera','Sran','Ambon','Buru','Gurun','Kei','Aru','Sorong','Wanin','Mamberamo','Papua Tengah','Papua Timur','Papua Selatan'].includes(n))return 'maluku';
 return 'jawa';
}
function fixTrade() {
 const home=tradeNode(capOf(G.nat)||NATS[G.nat].capital);
 G.trade ||= {home,merchants:[]};
 if(!TRADE_BY_ID[G.trade.home])G.trade.home=home;
 const seen=new Set();G.trade.merchants=(G.trade.merchants||[]).filter(m=>{
   if(!TRADE_BY_ID[m.node]||seen.has(m.node)||!['collect','steer'].includes(m.mode))return false;
   if(m.mode==='steer'&&m.node===G.trade.home){m.mode='collect';m.to=null;}
   if(m.mode==='steer'&&!TRADE_BY_ID[m.node].out.includes(m.to))return false;
   seen.add(m.node);m.left=Math.max(0,Number(m.left)||0);return true;
 }).slice(0,2);
}
function tradeReach(node) {
 if(!TRADE_BY_ID[node])return false;
 const owned=new Set((OWNED[G.nat]||[]).map(id=>tradeNode(PROV[id])));
 return owned.has(node)||TRADE_NODES.some(n=>owned.has(n.id)&&n.out.includes(node)||n.id===node&&n.out.some(to=>owned.has(to)));
}
function tradeDay() { for(const m of G.trade?.merchants||[])if(m.left>0)m.left--; }
function tradeSnapshot() {
 const nodes=Object.fromEntries(TRADE_NODES.map(n=>[n.id,{local:0,incoming:0,total:0,powers:{},raw:{},collected:0,forwarded:0,retained:0,bonus:0,player:0,share:0}]));
 const incomes={},homes={};for(const n of Object.keys(NATS))if(alive(n))homes[n]=n===G.nat?G.trade.home:tradeNode(capOf(n));
 for(const p of provs) {
   if(p.k!=='L'||!OWNR[p.id])continue;
   const node=nodes[tradeNode(p)],owner=OWNR[p.id],controller=CTRL[p.id]||owner;
   const q=G.pv[p.id]||G.provinceArchive?.[p.id],dev=q?[q.t,q.p,q.m]:baseDev(p),market=!!q?.bld.includes('pasar');
   const goods=goodsOf(p);
   if(goods!=='Emas'&&!G.expansion?.[p.id]?.revolt)node.local+=(dev[1]+(market?1:0))*.2*(GOODS[goods]||2)/12;
   let power=(.2*(dev[0]+dev[1]+dev[2])+(p.t==='coast'?2:0)+(p.r===1?5:0))*(market?1.5:1);
   // Pendudukan meniadakan pengaruh pemilik; pengendali mendapat separuh.
   if(controller!==owner)power*=.5;
   if(G.expansion?.[p.id]?.revolt)power=0;
   node.raw[controller]=(node.raw[controller]||0)+power;
 }
 const merchants=Object.fromEntries((G.trade.merchants||[]).filter(m=>!m.left).map(m=>[m.node,m]));
 let playerIncome=0;
 for(const f of G.fleets||[])if(f.mission==='trade'&&!f.port&&!f.path.length&&!f.retreat){const node=nodes[seaTradeNode(f.sea)];if(node)node.raw[f.nat]=(node.raw[f.nat]||0)+f.ships.reduce((s,x)=>s+(x.type==='patrol'?2:0)*x.hp/100,0);}
 for(const def of TRADE_NODES) {
   const node=nodes[def.id],m=merchants[def.id];node.powers={...node.raw};
   if(m)node.powers[G.nat]=(node.powers[G.nat]||0)+2;
   if(m?.mode==='collect'&&def.id!==G.trade.home)node.powers[G.nat]=(node.powers[G.nat]||0)*.5;
   const totalPower=Object.values(node.powers).reduce((a,b)=>a+b,0);
   node.total=node.local+node.incoming;
   node.share=totalPower?(node.powers[G.nat]||0)/totalPower:0;
   const steering=[];
   for(const [n,power] of Object.entries(node.powers)) {
     const share=totalPower?power/totalPower:0;
     const collect=homes[n]===def.id || n===G.nat&&m?.mode==='collect';
     if(collect) {
       const value=node.total*share;node.collected+=value;
       const efficiency=n===G.nat?Math.max(0,1.2+.02*(G.tech[1]-3)+modSum('trade')):1.2;
       const income=value*efficiency*(n===G.nat&&m?.mode==='collect'?1.1:1);
       incomes[n]=(incomes[n]||0)+income;if(n===G.nat){node.player=income;playerIncome+=income;}
     }else steering.push({n,power});
   }
   const uncollected=Math.max(0,node.total-node.collected);
   if(!def.out.length){node.retained=uncollected;continue;}
   const weights=Object.fromEntries(def.out.map(to=>[to,0]));
   for(const entry of steering) {
     const to=entry.n===G.nat&&m?.mode==='steer'?m.to:def.out[0];weights[to]+=entry.power;
   }
   const weight=Object.values(weights).reduce((a,b)=>a+b,0);
   if(!weight)weights[def.out[0]]=1;
   const denominator=weight||1;
   for(const to of def.out) {
     const value=uncollected*weights[to]/denominator;
     const bonus=m?.mode==='steer'&&m.to===to ? value*.05 : 0;
     nodes[to].incoming+=value+bonus;node.forwarded+=value;node.bonus+=bonus;
   }
 }
 return {nodes,incomes,income:playerIncome};
}
function tradeHTML() {
 const snap=tradeSnapshot(),free=2-G.trade.merchants.length;
 let h=hd('Perdagangan',`Pedagang bebas ${free}/2 · +${snap.income.toFixed(2)} dukat/bln`)+row('Pelabuhan utama',TRADE_BY_ID[G.trade.home].n);
 h+='<p class="note">Ibu kota mengumpulkan otomatis. Pedagang tiba dalam 30 hari; memberi +2 kekuatan. Kumpulkan di luar pelabuhan utama: kekuatan −50%. Arahkan: tambah 5% nilai di rute terpilih.</p>';
 for(const n of [...TRADE_NODES].sort((a,b)=>Number(b.id===G.trade.home)-Number(a.id===G.trade.home))) {

   h+='<div class="sec">'+n.n+(n.id===G.trade.home?' · Utama':'')+'</div>'+row('Nilai lokal / masuk',r.local.toFixed(2)+' / '+r.incoming.toFixed(2))+row('Pangsa kekuatan',(r.share*100).toFixed(1)+'%')+row('Pendapatan kerajaan',r.player.toFixed(2))+'<p class="note">Aliran: '+(n.out.map(to=>TRADE_BY_ID[to].n).join(' / ')||'Node akhir')+(m?'<br>Pedagang: '+(m.left?'tiba '+m.left+' hari':m.mode==='collect'?'Mengumpulkan':'Mengarahkan ke '+TRADE_BY_ID[m.to].n):'')+'</p>';
   h+='<div class="r">'+btn('Kumpulkan','merchant',{node:n.id,mode:'collect'},reach&&(!!m||free>0));

   for(const to of n.out)h+='<div class="r">'+btn('Arahkan → '+TRADE_BY_ID[to].n,'merchant',{node:n.id,mode:'steer',to},n.id!==G.trade.home&&reach&&(!!m||free>0))+'</div>';
   h+='<div class="r">'+btn('Lihat wilayah','tradelook',{node:n.id})+'</div>';
 }
 return h+'<p class="note">Kekuatan: development, provinsi pesisir, pusat kota, dan pasar. Jangkauan awal: node dengan wilayah kerajaan dan node tetangganya. Vasal dan tributary bersaing dengan kekuatan dagangnya sendiri.</p>';
}

function aiContentMonth(){

  if(s.months<s.nextEvent)continue;

  const danger=warsOf(n).length||G.armies.some(a=>atWar(n,a.nat)&&LINK[cap.id].some(l=>l.to===a.loc));
  if(danger){
   const a=armies.find(a=>!a.bt&&!a.exiled&&OWNR[a.loc]===n);
   if(a&&regsOf(n)<aiFl(n)*1.3){a.regs++;addWorldLog(n+' memilih memobilisasi cadangan setelah dewan perang.');}
   else addWorldLog(n+' memilih mempertahankan benteng dan menunda mobilisasi.');
  }else{
   const neighbors=[...new Set((OWNED[n]||[]).flatMap(id=>LINK[id].map(l=>OWNR[l.to])))].filter(t=>t&&t!==n&&alive(t)&&!atWar(n,t));
   const t=neighbors.sort((a,b)=>relGet(n,b)-relGet(n,a))[0];
   if(t){relAdd(n,t,15);if(!subjectMaster(n)&&!subjectMaster(t)&&!allied(n,t)&&relGet(n,t)>=80&&G.al.filter(k=>k.split('|').includes(n)).length<2&&t!==G.nat){G.al.push(pairKey(n,t));addWorldLog(n+' dan '+t+' membentuk aliansi setelah pertukaran utusan.');}else addWorldLog(n+' memilih pertukaran utusan dengan '+t+'.');}
  }
 }
}
function worldContentHTML(){let h=hd('Kabar Kerajaan','Misi dan keputusan AI');for(const n of Object.keys(NATS).filter(n=>n!==G.nat&&alive(n))){const s=G.aiContent[n];h+=row(n,(s?.missions.length||0)+' misi · '+(s?.events||0)+' keputusan · '+(G.world?.claims[n+'|'+G.world.era]?.length||0)+' tujuan era');}return h+'<div class="sec">Catatan terbaru</div>'+[...(G.worldLog||[]),...G.log].slice(0,80).map(t=>'<p class="note">'+t+'</p>').join('');}

/* Sumber daya fisik dan pengolahan provinsi. */
const RESOURCE_NAMES={food:'Pangan',wood:'Kayu',iron:'Besi',spice:'Rempah'};
function fixResources(){G.resourceStocks ||= {};G.improvements ||= {};for(const n of Object.keys(NATS))G.resourceStocks[n] ||= {food:20,wood:15,iron:5,spice:0};}
function provinceResource(p){const g=goodsOf(p);return ['Beras','Ikan'].includes(g)?'food':g==='Kayu'?'wood':g==='Besi'?'iron':['Rempah-rempah','Lada'].includes(g)?'spice':null;}
function resourceYield(id){const p=PROV[id],type=provinceResource(p);if(!type)return 0;const q=G.pv[id],dev=q?q.p:baseDev(p)[1],imp=G.improvements[id];return (.4+dev*.12)*(imp?.built?2:1)*(G.expansion?.[id]?.revolt?0:1);}
function resourcesMonth(){fixResources();for(const p of provs){if(p.k!=='L')continue;const owner=OWNR[p.id],ctl=CTRL[p.id]||owner,imp=G.improvements[p.id];if(imp?.left&&owner===ctl){imp.left--;if(!imp.left)imp.built=true;}const k=provinceResource(p);if(k&&G.resourceStocks[ctl])G.resourceStocks[ctl][k]=Math.min(resourceCapacity(ctl,k),G.resourceStocks[ctl][k]+resourceYield(p.id)*(ctl===owner?1:.5));}for(const n of Object.keys(NATS))if(alive(n)){const s=G.resourceStocks[n];s.food=Math.max(0,s.food-regsOf(n)*.1-(OWNED[n]||[]).length*.1);}}
function resourcePanel(){const stock=G.resourceStocks[G.nat];let h=hd('Sumber Daya','Stok fisik · kapasitas 500 per jenis')+'<div class="r">'+btn('Dagang antarkerajaan ›','openresourcetrade',{})+'</div>';for(const k in RESOURCE_NAMES)h+=row(RESOURCE_NAMES[k],stock[k].toFixed(1))+'<div class="r">'+btn('Beli 5 · '+marketResourcePrice(k,'buy')+' dukat','resourcebuy',{k},G.treasury>=marketResourcePrice(k,'buy')&&stock[k]+5<=resourceCapacity(G.nat,k))+btn('Jual 5 · '+marketResourcePrice(k,'sell')+' dukat','resourcesell',{k},stock[k]>=5)+'</div>';h+='<p class="note">Kiriman aktif mencadangkan ruang gudang. Harga pasar lokal berbeda per barang; bandingkan dengan mitra kerajaan. Pangan dikonsumsi provinsi dan resimen. Stok pangan habis: biaya pasukan +20%. Kayu dipakai membangun pengolahan; besi dipakai rekrut mulai MIL 4. Pendudukan mengambil separuh produksi sumber daya; pengolahan tetap melekat pada provinsi saat dicaplok.</p>';for(const id of Object.keys(G.pv)){const p=PROV[id],k=provinceResource(p);if(!k)continue;const imp=G.improvements[id],tech=k==='iron'?G.tech[2]:G.tech[0];h+='<div class="sec">'+p.n+' · '+RESOURCE_NAMES[k]+'</div>'+row('Produksi bulanan',resourceYield(id).toFixed(1))+(imp?.built?row('Pengolahan','Selesai · hasil ×2'):imp?.left?row('Pembangunan',imp.left+' bulan'):btn('Bangun pengolahan · 50 dukat, 5 kayu','improveResource',{id},tech>=4&&G.treasury>=50&&stock.wood>=5&&!CTRL[id]));}return h;}
act.resourcebuy=b=>{const k=b.dataset.k,s=G.resourceStocks[G.nat],cost=marketResourcePrice(k,'buy');if(!(k in RESOURCE_NAMES)||G.treasury<cost||s[k]+5>resourceCapacity(G.nat,k))return;G.treasury-=cost;s[k]+=5;};
act.resourcesell=b=>{const k=b.dataset.k,s=G.resourceStocks[G.nat];if(!(k in RESOURCE_NAMES)||s[k]<5)return;s[k]-=5;G.treasury+=marketResourcePrice(k,'sell');};
act.improveResource=b=>{const id=+b.dataset.id,p=PROV[id],s=G.resourceStocks[G.nat];if(!G.pv[id]||!p||!provinceResource(p)||G.improvements[id]||CTRL[id]||G.treasury<50||s.wood<5)return;const tech=provinceResource(p)==='iron'?G.tech[2]:G.tech[0];if(tech<4)return;G.treasury-=50;s.wood-=5;G.improvements[id]={left:6,built:false};};
(()=>{const recruit=act.rec;act.rec=b=>{const s=G.resourceStocks[G.nat],needs=G.tech[2]>=4;if(needs&&s.iron<1){toast('Rekrut membutuhkan 1 besi.');return;}const mp=G.mp;recruit(b);if(needs&&G.mp<mp)s.iron-=1;};})();

/* Kesiapan pasukan: moral, latihan, profesionalisme dan pemeliharaan. */
function blendReadiness(a,b){const total=a.regs+b.regs;a.morale=((a.morale??1)*a.regs+(b.morale??1)*b.regs)/total;a.drill=((a.drill||0)*a.regs+(b.drill||0)*b.regs)/total;a.drilling=false;}
function recruitReady(a){blendReadiness(a,{regs:1,morale:.5,drill:0});a.regs++;}
function fixMilitary(){G.maintenance=Number.isFinite(G.maintenance)?lim(G.maintenance,0,1):1;G.professionalism ||= {};for(const n of Object.keys(NATS))G.professionalism[n] ||= 0;for(const a of G.armies){a.morale=Number.isFinite(a.morale)?lim(a.morale,0,1):1;a.drill=Number.isFinite(a.drill)?lim(a.drill,0,100):0;}}
const armyMaintenance=n=>n===G.nat?G.maintenance:1;
const armyCombatWidth=n=>Math.min(30,8+Math.floor(techOf(n)/2));
const armyQuality=a=>1+(a.drill||0)/100*.1+(G.professionalism?.[a.nat]||0)/100*.05+modSum(a.nat===G.nat?'discipline':'__none');
function militaryMonth(){fixMilitary();for(const a of G.armies){if(a.bt)continue;const maintenance=armyMaintenance(a.nat),cap=.5+.5*maintenance;a.morale=Math.min(cap,a.morale+.12*maintenance);if(a.nat!==G.nat)a.drilling=!warsOf(a.nat).length&&!a.path.length&&OWNR[a.loc]===a.nat&&!CTRL[a.loc];if(a.drilling&&maintenance===1&&!a.path.length&&OWNR[a.loc]===a.nat&&!CTRL[a.loc]&&!a.exiled){a.drill=Math.min(100,a.drill+2);a.morale=Math.min(.5,a.morale);G.professionalism[a.nat]=Math.min(100,G.professionalism[a.nat]+.1*a.regs/Math.max(1,regsOf(a.nat)));}else a.drill=Math.max(0,a.drill-.5);}}
act.maintenance=b=>{const v=+b.dataset.v;if(![0,.5,1].includes(v))return;G.maintenance=v;if(v<1)for(const a of myArmies()){a.drilling=false;a.morale=Math.min(a.morale??1,.5+.5*v);}saveGame(true);};
act.drill=b=>{const a=G.armies.find(a=>a.id===+b.dataset.id);if(!a||a.nat!==G.nat||a.bt||a.path.length||a.exiled||OWNR[a.loc]!==G.nat||CTRL[a.loc]||G.maintenance<1)return;a.drilling=!a.drilling;if(a.drilling)a.morale=Math.min(a.morale,.5);saveGame(true);};

/* ---------- Ekspansi: tuntutan, inti bertahap dan perlawanan daerah ---------- */
function conquestPriority(id,n,w){return (hasCore(id,n)?100:0)+(w.goal===+id?60:0)+(n===G.nat&&G.claims.includes(+id)?30:0)+(LINK[id].some(l=>OWNR[l.to]===n)?20:0)+(GOODS[goodsOf(PROV[id])]||2)*2+provDev(id);}
const hasCore=(id,n)=>!!G?.cores?.[id]?.includes(n) || BASE_OWN[id]===n;
const conquestAE=(w,id,n)=>provDev(id)*(hasCore(id,n)?.25:w.cb?.k==='nocb'?1.25:1);
const overextension=(n=G.nat)=>Object.entries(G.expansion||{}).reduce((s,[id,x])=>s+(OWNR[id]===n&&!hasCore(id,n)?provDev(id)*4:0),0);
const conquestGarrison=id=>G.armies.filter(a=>a.nat===OWNR[id]&&a.loc===+id&&!a.bt&&!a.exiled&&!a.path.length&&!a.drilling&&(a.morale??1)>=.5&&armyMaintenance(a.nat)>=.5).reduce((s,a)=>s+a.regs,0);
const revoltNeed=id=>lim(Math.ceil(provDev(id)/4),2,6);
function fixExpansion(){
  G.cores ||= {};G.expansion ||= {};G.provinceArchive ||= {};G.integrationRewards ||= {};
  for(const id in OWNR){if(PROV[id].k!=='L')continue;G.cores[id] ||= [BASE_OWN[id]];}
  // Simpan lama: hitungan inti yang sudah berjalan tetap selesai, tanpa bayar ulang.
  for(const id in G.pv){const q=G.pv[id];if(G.expansion[id])continue;
    if(q.nc>0)G.expansion[id]={owner:G.nat,previous:BASE_OWN[id],autonomy:35,sep:180,resistance:0,coreLeft:q.nc,coreTotal:q.nc,cooldown:0,harsh:0,revolt:0,local:0};
    else if(!G.cores[id].includes(G.nat))G.cores[id].push(G.nat);
  }
}
function registerConquest(id,to,from,peaceful){
  if(!G.cores)return;
  if(peaceful&&!hasCore(id,to))G.cores[id].push(to);
  const core=hasCore(id,to);
  G.expansion[id]={owner:to,previous:hasCore(id,from)?from:BASE_OWN[id],autonomy:core?0:35,sep:core?0:360,resistance:0,coreLeft:0,coreTotal:0,cooldown:0,harsh:0,revolt:0,local:0};
  if(G.pv[id])G.pv[id].nc=core?0:36;
}
function provinceControl(id){
  const x=G?.expansion?.[id];if(!x||x.owner!==OWNR[id])return 1;
  return x.revolt?0:(1-x.autonomy/100)*(hasCore(id,OWNR[id])?1:.5);
}
function conquestUnrest(id){
  const x=G.expansion?.[id];if(!x)return 0;
  const n=OWNR[id];let religion=0;
  if(n===G.nat){const k=relOf(id),t=tolOf(k);religion=(k!==G.rs&&t<0?-t*1.25:0)+(G.miss.some(m=>m.pid===+id)?6:0);}
  else if(relOf(id)!==relKey(NATS[n].relig))religion=2;
  return Math.round((x.sep/24+(hasCore(id,n)?0:4)+overextension(n)*.05+wexOf(n)*.25-(n===G.nat?G.stab:1)*2+religion+(x.cooldown?x.local:0)-Math.min(5,conquestGarrison(id)*.75))*10)/10;
}
function completeConquestCore(id){
  const n=OWNR[id],x=G.expansion[id];if(!G.cores[id].includes(n))G.cores[id].push(n);
  x.coreLeft=0;if(G.pv[id])G.pv[id].nc=0;
  const key=n+'|'+id;
  if(!G.integrationRewards[key]){G.integrationRewards[key]=true;if(n===G.nat){EF.prestige(3);EF.mana(0,10);}else addWorldLog(n+' menyelesaikan administrasi '+PROV[id].n+'.');}
  if(n===G.nat)toast(PROV[id].n+' menjadi inti! +3 prestise, +10 ADM (sekali per wilayah).');
}
function breakConquest(id){
  const x=G.expansion[id],from=OWNR[id],to=x.previous;
  if(!to||to===from||!NATS[to]){x.revolt=0;x.resistance=0;x.autonomy=90;return;}
  transferProv(id,to,true);rebuildOwned();
  if(!G.armies.some(a=>a.nat===to))mkArmy(to,revoltNeed(id),+id);
  G.truce[pairKey(to,from)]=monthIdx()+60;
  for(const a of G.armies)if(a.nat===from&&a.loc===+id&&!a.bt){a.path=[];a.prog=0;if(a.nat!==G.nat)aiReturnHome(a);else{a.exiled=true;const h=capOf(from);if(h){const route=distMap(from,a.loc,true);if(route.dist[h.id]!=null){const path=[];let cur=h.id;while(cur!==a.loc){path.unshift(cur);cur=route.prev[cur];}a.path=path;}}}}
  addLog(PROV[id].n+' memisahkan diri dan kembali kepada '+to+'.');
  if(from===G.nat){EF.prestige(-5);toast('Perlawanan '+PROV[id].n+' berhasil! Wilayah lepas ke '+to+'.');}
  finishNationCheck(from);refreshWorld();syncRegs();
}
function conquestMonth(){
  if(!G.expansion)return;
  for(const id of Object.keys(G.expansion)){
    const x=G.expansion[id],n=OWNR[id];if(!n||x.owner!==n)continue;
    if(x.cooldown>0)x.cooldown--;if(x.harsh>0)x.harsh--;if(x.sep>0)x.sep--;
    if(CTRL[id]&&CTRL[id]!==n)continue;
    if(!warsOf(n).length&&!x.revolt)x.autonomy=Math.max(0,x.autonomy-.1);
    if(n!==G.nat&&!hasCore(id,n)&&!x.coreLeft){x.coreLeft=36;x.coreTotal=36;}
    if(x.coreLeft>0&&!x.revolt){x.coreLeft--;if(G.pv[id])G.pv[id].nc=x.coreLeft||0;if(!x.coreLeft)completeConquestCore(id);}
    if(x.revolt){
      if(conquestGarrison(id)>=revoltNeed(id)){
        x.resistance=Math.max(0,x.resistance-25);
        if(x.resistance===0){x.revolt=0;x.sep=Math.max(0,x.sep-60);x.warned=false;if(n===G.nat)toast('Perlawanan di '+PROV[id].n+' dipadamkan.');}
      }else if(--x.revolt<=0){breakConquest(+id);continue;}
    }else{
      const u=conquestUnrest(id),rate=u>0?u*.35*(overextension(n)>100?1.5:1):-3;
      x.resistance=lim(x.resistance+rate,0,100);
      if(x.resistance>=70&&!x.warned&&n===G.nat){x.warned=true;pushEvent({t:'Gejolak di '+PROV[id].n,x:'Perlawanan mencapai '+Math.round(x.resistance)+'%. Pada 100%, hasil daerah terhenti dan tuntutan pemisahan dapat berlaku. Kirim garnisun, beri otonomi, atau tekan perlawanan dengan MIL.',o:[['Tinjau daerah','inspectConquest',{id:+id}],['Nanti','ok',{}]]});}
      if(x.resistance>=100){x.revolt=6;if(n===G.nat){toast('Perlawanan di '+PROV[id].n+'! Kirim '+revoltNeed(id)+' resimen siap tempur atau beri otonomi.');addLog('Perlawanan '+PROV[id].n+': tuntutan akan berlaku setelah 6 bulan tanpa garnisun.');paused=true;}}
    }
    if(n!==G.nat&&!x.revolt&&x.resistance>=70&&!x.cooldown){x.autonomy=Math.min(100,x.autonomy+25);x.cooldown=120;x.local=-10;x.resistance=Math.max(0,x.resistance-20);}
  }
}
function aiSuppressConquest(a){
  if(a.exiled)return false;
  const targets=Object.keys(G.expansion||{}).filter(id=>OWNR[id]===a.nat&&G.expansion[id].revolt).sort((a,b)=>G.expansion[a].revolt-G.expansion[b].revolt);
  for(const id of targets){if(a.loc===+id){a.drilling=false;a.aiTask='Memadamkan perlawanan '+PROV[id].n;return true;}if(orderMove(a,+id,true)){a.aiTask='Memadamkan perlawanan '+PROV[id].n;return true;}}
  return false;
}
act.coreit=b=>{
  const id=+b.dataset.id,x=G.expansion[id];if(!G.pv[id]||OWNR[id]!==G.nat||!x||hasCore(id,G.nat)||x.coreLeft||x.revolt||CTRL[id])return;
  const cost=coreCost(id);if(G.mana[0]<cost)return;G.mana[0]-=cost;x.coreLeft=24;x.coreTotal=24;saveGame(true);toast('Administrasi '+PROV[id].n+' dimulai: 24 bulan. Pendudukan/perlawanan menunda progres.');
};
act.autonomy=b=>{
  const id=+b.dataset.id,x=G.expansion[id],up=b.dataset.v==='up';if(!x||OWNR[id]!==G.nat||x.cooldown||CTRL[id])return;
  if(up){if(x.autonomy>75)return;x.autonomy=Math.min(100,x.autonomy+25);x.local=-10;x.resistance=Math.max(0,x.resistance-20);if(x.revolt){x.revolt=0;x.resistance=0;x.autonomy=Math.max(75,x.autonomy);x.sep=Math.max(0,x.sep-60);}}
  else{if(x.autonomy<25||x.revolt)return;x.autonomy-=25;x.local=5;}
  x.cooldown=120;saveGame(true);
};
act.harshconquest=b=>{const id=+b.dataset.id,x=G.expansion[id];if(!x||OWNR[id]!==G.nat||x.revolt||x.harsh||CTRL[id]||G.mana[2]<30||x.resistance<30)return;G.mana[2]-=30;x.resistance-=30;x.harsh=6;saveGame(true);};
function conquestProvinceHTML(id){
  const x=G.expansion?.[id];if(!x)return '';
  let h='<div class="sec">Integrasi wilayah</div>'+row('Status',hasCore(id,G.nat)?'Inti kerajaan':x.coreLeft?'Administrasi '+(x.coreTotal-x.coreLeft)+'/'+x.coreTotal+' bulan'+(CTRL[id]||x.revolt?' · tertunda':''):'Belum inti')+row('Otonomi',x.autonomy.toFixed(1)+'%')+row('Hasil pajak/produksi/tenaga',Math.round(provinceControl(id)*100)+'%')+row('Separatisme',Math.ceil(x.sep/12)+' tahun')+row('Keresahan',conquestUnrest(id).toFixed(1))+row('Perlawanan',x.resistance.toFixed(0)+'%'+(x.revolt?' · AKTIF':''));
  if(!hasCore(id,G.nat)&&!x.coreLeft)h+='<div class="r">'+btn('Jadikan inti · '+coreCost(id)+' ADM','coreit',{id},G.mana[0]>=coreCost(id)&&!CTRL[id]&&!x.revolt)+'</div>';
  if(x.revolt)h+='<div class="r">'+btn('Terima tuntutan · otonomi ≥75%','concedeconquest',{id})+'</div><p class="note neg">Hasil wilayah terhenti. Garnisun '+revoltNeed(id)+' resimen siap tempur menekan perlawanan 25 poin/bulan. Tanpa garnisun, tuntutan berlaku dalam '+x.revolt+' bulan: kembali ke '+x.previous+'.</p>';
  h+='<div class="r">'+btn('Otonomi +25','autonomy',{id,v:'up'},!x.cooldown&&!CTRL[id]&&x.autonomy<=75)+btn('Otonomi −25','autonomy',{id,v:'down'},!x.cooldown&&!CTRL[id]&&x.autonomy>=25&&!x.revolt)+'</div><p class="note">Naik: keresahan −10 selama 10 tahun, hasil berkurang; mengakhiri perlawanan aktif dengan otonomi minimal 75%. Turun: keresahan +5 selama 10 tahun. '+(x.cooldown?'Dapat diubah lagi '+x.cooldown+' bulan.':'')+'</p>';
  return h+'<div class="r">'+btn('Tekan perlawanan −30 · 30 MIL','harshconquest',{id},!x.harsh&&!x.revolt&&!CTRL[id]&&x.resistance>=30&&G.mana[2]>=30)+'</div>';
}
function peaceExpansion(w,ids,n){
  let adm=0,dip=0,oe=0,ae=0;for(const id of ids){ae+=conquestAE(w,id,n);if(!hasCore(id,n)){oe+=provDev(id)*4;adm+=n===G.nat?coreCost(id):10+provDev(id)*4;if(!(w.goals||[]).includes(id)&&!(n===G.nat&&G.claims.includes(+id)))dip+=provDev(id)*2;}}
  const score=ids.reduce((s,id)=>s+provCost(id,n),0);return {adm,dip,oe,ae,score};
}
function peaceOfferText(w,ids,n){const p=peaceExpansion(w,ids,n);return 'Dampak: +'+p.oe+'% overextension, '+p.adm+' ADM untuk inti, '+p.dip+' DIP tuntutan, +'+p.ae.toFixed(1)+' AE. Gencatan '+(peaceTruce(p.score)/12).toFixed(1)+' tahun.';}
const peaceTruce=score=>60+Math.round(lim(score,0,100)*1.2);
function peaceExpansionHTML(w,ids,gold,vas){
  const p=peaceExpansion(w,ids,G.nat),oe=overextension()+p.oe,truce=peaceTruce(p.score+(gold?8*gold/50:0)+(vas?100:0));
  const ae=p.ae+(vas?8:0),risk=Object.keys(NATS).filter(n=>n!==G.nat&&alive(n)&&!subjectMaster(n)&&!allied(n,G.nat)&&relGet(n,G.nat)<=25&&capOf(n)&&Math.hypot(capOf(n).lab[0]-capOf(G.nat).lab[0],capOf(n).lab[1]-capOf(G.nat).lab[1])<450);
  return row('Ekspansi agresif','+'+ae.toFixed(1)+' → '+Math.round(aeOf(G.nat)+ae))+row('Biaya inti nanti',p.adm+' ADM')+row('Tuntutan tanpa klaim',p.dip+' DIP (kini '+Math.floor(G.mana[1])+')')+row('Overextension setelah damai',oe.toFixed(0)+'%'+(oe>100?' ⚠':''))+row('Gencatan senjata',(truce/12).toFixed(1)+' tahun')+(aeOf(G.nat)+ae>=40?'<p class="note neg">Risiko koalisi di sekitar Anda: '+(risk.join(', ')||'Belum ada kandidat')+'. Perkiraan, bukan jaminan bergabung.</p>':'');
}
function expansionHTML(){
  const oe=overextension(),list=Object.keys(G.expansion).filter(id=>OWNR[id]===G.nat).sort((a,b)=>(G.expansion[b].revolt||0)-(G.expansion[a].revolt||0)||G.expansion[b].resistance-G.expansion[a].resistance);
  let h=hd('Ekspansi & Integrasi','Taklukkan · tata daerah · lanjutkan ekspansi')+row('Overextension',oe.toFixed(0)+'%'+(oe>100?' ⚠':''))+aeRowHTML()+row('Keresahan dari ekspansi','+'+(oe*.05).toFixed(1))+'<p class="note">Wilayah noninti memberi 4% overextension per development dan hanya separuh hasil sebelum otonomi. Di atas 100%, perlawanan tumbuh 50% lebih cepat. Inti memerlukan ADM dan 24 bulan; separatisme pulih perlahan. Inti baru memberi +3 prestise dan +10 ADM sekali per wilayah.</p><div class="sec">Daerah yang perlu ditata</div>';
  for(const id of list)h+='<button class="btn rowb" data-act="expansionprov" data-id="'+id+'"><span>'+PROV[id].n+' · '+(G.expansion[id].revolt?'⚠ Perlawanan aktif':hasCore(id,G.nat)?'Inti':G.expansion[id].coreLeft?'Inti '+G.expansion[id].coreLeft+' bln':'Belum inti')+'</span><em>'+G.expansion[id].resistance.toFixed(0)+'% perlawanan</em></button>';
  if(!list.length)h+='<p class="note">Belum ada daerah taklukan yang perlu ditata.</p>';
  h+='<div class="sec">Peluang di perbatasan</div>';

 if(!Object.hasOwn(NATS,n)||n===G.nat||!alive(n)||!alive(G.nat))return {reason:'Kerajaan tidak tersedia.'};

function resourceQuote(n,k,kind,qty=RESOURCE_QUANTITY){

 if(!Object.hasOwn(RESOURCE_BASE,k)||!['buy','sell'].includes(kind)||![5,10,20].includes(qty))return {reason:'Pesanan tidak valid.'};
 if((G.resourceOrders||[]).length>=3)return {reason:'Maksimal tiga kiriman aktif.'};
 const stock=G.resourceStocks[n][k],friend=Math.min(.12,Math.max(0,relGet(G.nat,n))*.0005+(allied(G.nat,n)||subjectMaster(n)===G.nat?.04:0));
 const mid=RESOURCE_BASE[k]*lim(1.4-stock/150,.65,1.4),unit=mid*(kind==='buy'?1.15-friend:.75+friend);

 const reserve=kind==='buy'?(k==='food'?Math.max(5,regsOf(n)*.3+(OWNED[n]||[]).length*.5):k==='wood'?3:k==='iron'?1:0):0;
 let reason='';if(G.resourceStocks[from][k]<qty+reserve)reason=kind==='buy'?'Mitra menjaga cadangan; stok surplus belum cukup.':'Stok Anda belum cukup.';
 else if(G.resourceStocks[to][k]+qty>resourceCapacity(to,k))reason='Gudang penerima penuh atau sedang dicadangkan untuk kiriman.';
 else if(total<=0)reason='Ongkos terlalu besar; pilih jumlah lebih banyak.';

}

          if(beat===14)drum(t,.026,120,peace);
        }
        if(scene!=='peace'||war.gain.value>.01){
          if(beat===0)gong(55,t,.085,war);
          if(beat%4===0)osc('sine',55,t,.04,.8,.07,war);
          if(beat%2===0)bell(hz(130,campaign[(beat/2+bar%2)%8]),t,.038,war);
          drum(t,beat%4===0?.065:.034,beat%4===0?100:145,war);
          if(beat===7||beat===15)drum(t+.22,.027,165,war);
          if(beat===0&&bar%4===0)horn(t,110,.85,.026,war);
        }
        if(scene==='battle'||battle.gain.value>.01){
          if(beat%2===1)drum(t+.22,.038,175,battle);
          if(beat%4===2)bell(hz(220,campaign[beat%8]+2),t,.025,battle);
        }
      }
      next+=.46;step++;
    }
  }
  return {init,play,
    pauseAll(v){hidden=!!v;if(!ctx)return Promise.resolve();if(v)return ctx.suspend();next=Math.max(next,T()+.04);mix();return ctx.resume();},
    get sfx(){return sfxOn;},get mus(){return musOn;},get levels(){return {...levels};},get scene(){return currentScene();},get voices(){return voices;},
    setSfx(v){sfxOn=!!v;mix();save();},setMus(v){musOn=!!v;mix();save();},
    setLevel(k,v){if(!(k in levels)||!Number.isFinite(+v))return;levels[k]=lim(+v,0,100);mix();save();},
  };
})();
function soundSettingsHTML(){
  let h='<div class="sec">Audio</div><div class="r">'+btn('Efek: '+(SFX.sfx?'NYALA':'MATI'),'sfx',{})+btn('Musik: '+(SFX.mus?'NYALA':'MATI'),'mus',{})+'</div>';
  for(const [k,label] of [['interface','Klik & menu'],['effects','Efek permainan'],['music','Musik latar']])h+='<label class="r" for="sound-'+k+'"><span>'+label+'</span><b id="sound-value-'+k+'">'+SFX.levels[k]+'%</b></label><input id="sound-'+k+'" data-sound="'+k+'" aria-label="Volume '+label+'" type="range" min="0" max="100" step="5" value="'+SFX.levels[k]+'" style="width:calc(100% - 24px);margin:4px 12px 12px;accent-color:#e9bf67">';
  return h+'<p class="note">Musik mengikuti kerajaan Anda: damai, perang, dan pertempuran. Transisi halus; musik merendah sebentar saat kabar penting. Pengaturan tersimpan di perangkat ini.</p>';
}
document.addEventListener('input',e=>{const k=e.target.dataset?.sound;if(!k)return;SFX.setLevel(k,e.target.value);const v=$('sound-value-'+k);if(v)v.textContent=SFX.levels[k]+'%';});
['pointerdown','touchend','keydown'].forEach(ev=>window.addEventListener(ev,()=>SFX.init(),{passive:true}));
document.addEventListener('visibilitychange',()=>SFX.pauseAll(document.hidden).catch(()=>{}));

/* ---------- kait suara ke game ---------- */
(() => {
  const P = SFX.play;
  const _toast = toast;
  toast = function (t) {
    _toast(t);
    const me = typeof G !== 'undefined' && G ? G.nat : '';
    if (/^Kemenangan/.test(t)) P('win'); else if (/^Kekalahan/.test(t)) P('lose');
    else if (/menyatakan perang/.test(t)&&me&&t.includes(me)) P('war');
    else if (/^Perang berakhir/.test(t)) P('peace');
    else if (/selesai dibangun/.test(t)) P('build');
    else if (/^Membangun/.test(t)) P('coin');
    else if (/naik ke/.test(t)) P('up');
    else if (/lenyap/.test(t)) P('gone');
    else if (/diduduki|dibebaskan/.test(t)) P('alert');
    else if (/menjadi inti|kini menjadi provinsi inti/.test(t)) P('core');
    else if (/menerima aliansi|Pernikahan|memberi akses/.test(t)) P('diplomacy');
    else if (/Hadiah|disimpan/.test(t)) P('ok');
    else if (/ditolak|Tidak ada rute|menolak|tidak mau|Kas habis/.test(t)) P('no');
    // Notifikasi biasa tetap tenang; bunyi hanya untuk kejadian yang bermakna.
  };
  const _om = orderMove;
  orderMove = function (a) { const r = _om.apply(this, arguments); if (r && a && a.nat === G.nat) P('march', 200); return r; };
  const _se = showEvent;
  showEvent = function () { const was = $('modal').classList.contains('open'); const r = _se.apply(this, arguments); if (!was && $('modal').classList.contains('open')) P('event'); return r; };
  const _bg = beginGame;
  beginGame = function () { const r = _bg.apply(this, arguments); P('start'); return r; };
  const _mt = onMapTap;
  onMapTap = function () { const s0 = G && G.sel; const r = _mt.apply(this, arguments); P(G && G.sel && G.sel !== s0 ? 'sel' : 'tap'); return r; };
  $('app').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.disabled) return P('no');
    const a = b.dataset.act;
    if (a === 'win') P(winMode === b.dataset.w ? 'close' : 'open'); else if (a === 'close') P('close'); else if(a==='rec') P('recruit'); else if(a==='merchant')P('trade'); else if (a === 'loan') P('coin'); else if (a === 'stab') P('up'); else P('tap');
  }, true);
  $('pause').addEventListener('click', () => P('tap'));
  act.sfx = () => { SFX.setSfx(!SFX.sfx); if (SFX.sfx) P('ok'); };
  act.mus = () => SFX.setMus(!SFX.mus);
  const z = document.createElement('button'); z.id = 'zsnd'; z.className = 'btn'; z.title = 'Suara';
  const ico = () => { z.innerHTML = `<svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 8h3l5-4v12l-5-4H3z"/>${(SFX.sfx&&(SFX.levels.effects>0||SFX.levels.interface>0)||SFX.mus&&SFX.levels.music>0) ? '<path d="M13.5 7.5a3.5 3.5 0 010 5M15.5 5.5a6.5 6.5 0 010 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' : '<path d="M13 8l5 5M18 8l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'}</svg>`; };
  window.addEventListener('nus-soundchange',ico);
  ico(); z.onclick = () => { const on = SFX.sfx || SFX.mus; SFX.setSfx(!on); SFX.setMus(!on); ico(); if (!on) P('ok'); };
  $('rightControls').appendChild(z);
  const _ico = ico; $('app').addEventListener('click', e => { if (e.target.closest('[data-act="sfx"],[data-act="mus"]')) _ico(); });
})();
