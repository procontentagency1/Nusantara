<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#2a1c0d">
<title>Nusantara 1350 · Peta Majapahit (Tahap 1)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#f1d38a;--gd:#9c7a3c;--paper:#f6e9c8}
html,body{margin:0;height:100%;overflow:hidden;background:#0d2a3b;font-family:Georgia,serif;color:var(--paper);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0}
canvas#map{position:absolute;left:0;top:0;display:block;touch-action:none;cursor:grab}
.abs{position:absolute}
.wood{background:linear-gradient(180deg,#4a3519 0%,#2b1d0d 100%);border:1.5px solid var(--gd);box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 rgba(255,231,166,.3),0 4px 12px rgba(0,0,0,.5)}
.btn{background:linear-gradient(#5a4220,#2d1f0e);border:1px solid #000;border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,231,166,.35);color:var(--gold);cursor:pointer;padding:0;display:grid;place-items:center}
.btn:active{filter:brightness(1.3)}
.btn.on{background:linear-gradient(#f5dc95,#a77c34);color:#2a1a08}
.btn:disabled{opacity:.35;cursor:default}

/* top bar */
#top{left:0;right:0;top:0;height:38px;background:linear-gradient(180deg,#5d4422 0%,#33240f 60%,#22170a 100%);border-bottom:2px solid #b08d45;box-shadow:inset 0 1px 0 #ffe7a6,0 3px 10px rgba(0,0,0,.5);z-index:5;display:flex;align-items:center;padding-left:72px;padding-right:6px;gap:5px}
#crest{position:absolute;left:6px;top:2px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6dc92,#8a6226 75%);border:2px solid #000;box-shadow:0 0 0 2px var(--gd),0 3px 8px rgba(0,0,0,.6);display:grid;place-items:center;z-index:6}
#crest svg{width:40px;height:40px}
.res{display:flex;align-items:center;gap:4px;height:26px;padding:0 6px 0 3px;background:linear-gradient(#2c1f10,#150f08);border:1px solid var(--gd);border-radius:13px;font:600 11px system-ui,sans-serif;white-space:nowrap}
.res i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font:700 10px Georgia,serif;color:#241607;border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.res i{flex:none}.res i svg{width:14px;height:14px;display:block}.res{color:var(--paper);cursor:pointer}.res:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.res em{font-style:normal;opacity:.55;font-weight:500;font-size:10px}
.sp{flex:1}
#time{display:flex;align-items:center;gap:6px;height:30px;padding:0 5px 0 9px;background:linear-gradient(#2c1f10,#150f08);border:1px solid var(--gd);border-radius:6px}
#time b{color:var(--gold);font-size:12px;white-space:nowrap}
#pause{width:22px;height:22px;border-radius:50%;font-size:9px}
.pips{display:flex;gap:2px}.pips i{width:5px;height:11px;background:#3b2c18;border:1px solid #000}.pips i.on{background:var(--gold)}
#paused{left:50%;top:39px;transform:translateX(-50%);z-index:4;padding:2px 22px;font:700 11px Georgia,serif;letter-spacing:2px;text-transform:uppercase;color:#ffe9c0;background:linear-gradient(#a02c22,#5e1510);border:1.5px solid #e2b865;border-top:0;border-radius:0 0 8px 8px;box-shadow:0 3px 8px rgba(0,0,0,.5)}

/* province window */
#prov{left:6px;top:46px;width:232px;max-height:calc(100% - 54px);z-index:6;overflow:auto;transform:translateX(-120%);transition:transform .25s ease;border-radius:4px}
#prov.open{transform:translateX(0)}
#prov .hd{display:flex;align-items:center;gap:7px;padding:6px 7px;background:linear-gradient(#7a5a26,#43301a);border-bottom:2px solid #000}
#chip{width:20px;height:20px;border:2px solid #000;border-radius:3px;flex:none}
#prov h2{margin:0;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
#prov .sub{font:10px system-ui,sans-serif;opacity:.8}
#x{width:22px;height:22px;margin-left:auto;font-size:11px;border-radius:50%}
.tabs{display:flex;border-bottom:1px solid #000}
.tabs button{flex:1;padding:5px 0;border:0;background:#2b1d0d;font:600 11px system-ui,sans-serif;color:#cdb98a}
.tabs button.on{background:linear-gradient(#5a4220,#3a2912);color:var(--gold)}
.dev{display:flex;justify-content:space-around;padding:6px 4px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(241,211,138,.2)}
.dev div{display:flex;flex-direction:column;align-items:center;font:700 13px system-ui,sans-serif;gap:2px}
.dev i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px Georgia,serif;color:#241607;border:1px solid #000}
.dev small{font:9px system-ui,sans-serif;opacity:.6;font-weight:400}
#prov .r{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;font:11px system-ui,sans-serif;border-bottom:1px solid rgba(241,211,138,.12)}
#prov .r span{opacity:.65}#prov .r b{font-weight:600;text-align:right}
#prov .note{margin:0;padding:6px 9px 8px;font:10px system-ui,sans-serif;opacity:.55;line-height:1.4}

/* minimap & controls */
#mini{right:6px;bottom:6px;padding:4px;z-index:4;width:184px}
#mini.compact{width:auto}
#mini.compact #mm{display:none}
#mini.compact #modes{margin-bottom:0}
#mm{display:block;width:174px;border:1px solid #000;background:#0f2e42;touch-action:none}
#modes{display:flex;gap:3px;margin-bottom:4px}
#modes button{flex:1;height:26px;font-size:13px;position:relative}
#zoom{right:6px;top:50%;transform:translateY(-60%);display:flex;flex-direction:column;gap:4px;z-index:4}
#zoom button{width:30px;height:30px;border-radius:50%;font-size:16px}
#hint{left:50%;bottom:8px;transform:translateX(-50%);font:11px system-ui,sans-serif;background:rgba(15,9,3,.78);padding:5px 10px;border-radius:5px;border:1px solid rgba(156,122,60,.6);transition:opacity .6s;pointer-events:none;z-index:3;white-space:nowrap}
#hint.gone{opacity:0}

/* phase toggles */
#app[data-phase=start] #top,#app[data-phase=start] #rail,#app[data-phase=start] #paused,#app[data-phase=start] #mini,#app[data-phase=start] #crest{display:none}
#app[data-phase=game] #start{display:none}
#app[data-phase=start] #zoom{top:50px;transform:none}
#start{position:absolute;inset:0;pointer-events:none;z-index:7}
#start>*{pointer-events:auto}
#stTitle{left:50%;top:6px;transform:translateX(-50%);padding:5px 26px 6px;text-align:center;background:linear-gradient(#6b4f22,#33240f);border:2px solid #b08d45;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.55)}
#stTitle b{display:block;color:var(--gold);font-size:15px;letter-spacing:3px}
#stTitle small{font:10px system-ui,sans-serif;opacity:.8}
#stPanel{left:6px;top:6px;width:236px;max-height:calc(100% - 62px);overflow:auto;border-radius:4px}
#stPanel .hd{display:flex;gap:9px;align-items:center;padding:8px;background:linear-gradient(#7a5a26,#43301a);border-bottom:2px solid #000}
#stFlag{width:38px;height:38px;border:2px solid #000;border-radius:5px;display:grid;place-items:center;color:#fff3cf;font-size:18px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
#stPanel h2{margin:0;font-size:16px;color:var(--gold);text-transform:uppercase;letter-spacing:.8px}
#stPanel .sub{font:10px system-ui,sans-serif;opacity:.8}
#stPanel .r{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;font:11.5px system-ui,sans-serif;border-bottom:1px solid rgba(241,211,138,.12)}
#stPanel .r span{opacity:.65}#stPanel .r b{text-align:right}
.stars{color:var(--gold);letter-spacing:2px}
#stList{left:248px;right:150px;bottom:6px;display:flex;gap:5px;overflow-x:auto;padding:5px;border-radius:5px}
#stList button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 9px;font:600 11px system-ui,sans-serif;white-space:nowrap;height:32px}
#stList i{width:12px;height:12px;border:1px solid #000;border-radius:2px}
#stList .lbl{align-self:center;font:10px system-ui,sans-serif;opacity:.6;flex:none;margin-right:2px}
#btnStart{right:6px;bottom:6px;width:138px;height:44px;font:700 14px Georgia,serif;letter-spacing:1px;color:#2a1a08;background:linear-gradient(#f5dc95,#a77c34);border:2px solid #000;border-radius:6px;cursor:pointer;box-shadow:inset 0 1px 0 #fff3c0,0 4px 12px rgba(0,0,0,.6)}
#btnStart:disabled{opacity:.4;filter:grayscale(.6)}
.mini-btn{margin:7px 9px;padding:6px 10px;font:600 11px system-ui,sans-serif;width:calc(100% - 18px)}

/* rail + windows */
#rail{left:6px;top:66px;display:flex;flex-direction:column;gap:4px;z-index:5}
#rail button{width:32px;height:32px;font-size:15px;border-radius:5px}
#rail{gap:3px}#rail button.red{background:linear-gradient(#a02c22,#5e1510);color:#ffe9c0}
#modal{inset:0;display:none;place-items:center;z-index:20;background:rgba(0,0,0,.5)}#modal.open{display:grid}
.mbox{width:min(300px,86%);background:linear-gradient(#4a3519,#2b1d0d);border:2px solid #b08d45;border-radius:6px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.7);font:12px system-ui,sans-serif;color:#f1e3c1}
.mbox h3{margin:0 0 6px;font:700 15px Georgia,serif;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}.mbox p{margin:0 0 10px;line-height:1.45}
.mbox .mo{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mbox .mo button{padding:6px 12px;font:600 12px system-ui,sans-serif;border-radius:4px}
.rowb{display:flex!important;justify-content:space-between;align-items:center;gap:6px;width:100%;box-sizing:border-box;padding:6px 9px;border-radius:0;font:11.5px system-ui,sans-serif;text-align:left;border-width:0 0 1px;border-color:rgba(241,211,138,.15)}
.rowb em{font-style:normal;opacity:.75;font-size:10.5px;text-align:right}.rowb.on{background:linear-gradient(#6b5a22,#3d3114)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;border:1px solid #000;vertical-align:-1px}
.sb{position:relative;width:110px;height:14px;background:linear-gradient(90deg,#7a2418,#7a2418 50%,#2f6a2c 50%);border:1px solid #000;border-radius:3px;overflow:hidden}
.sb i{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.0);border-right:2px solid #ffe9a0}.sb b{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;text-shadow:0 0 3px #000;color:#fff}
#win{left:46px;top:44px;width:240px;max-height:calc(100% - 52px);z-index:6;overflow:auto;transform:translateX(-130%);transition:transform .25s ease;border-radius:4px}
#win.open{transform:translateX(0)}
#win .hd{display:flex;align-items:center;gap:7px;padding:6px 7px;background:linear-gradient(#7a5a26,#43301a);border-bottom:2px solid #000;position:sticky;top:0;z-index:2}
#win h2{margin:0;font-size:14px;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;line-height:1.1}
#win .sub{font:10px system-ui,sans-serif;opacity:.8}
#win .r{display:flex;justify-content:space-between;gap:8px;padding:4px 9px;font:11.5px system-ui,sans-serif;border-bottom:1px solid rgba(241,211,138,.12);align-items:center}
#win .r span{opacity:.7}#win .r b{font-weight:600;text-align:right}
#win .sec{padding:4px 9px;font:700 10px system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;background:rgba(0,0,0,.3);color:var(--gold)}
#win .note{margin:0;padding:6px 9px 8px;font:10px system-ui,sans-serif;opacity:.55;line-height:1.4}
.pos{color:#9fe08a}.neg{color:#ff9a8a}
.ab{padding:4px 8px;font:600 10.5px system-ui,sans-serif;min-height:26px;white-space:nowrap}
.dev{display:flex;justify-content:space-around;padding:6px 4px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(241,211,138,.2)}
.dev div{display:flex;flex-direction:column;align-items:center;font:700 13px system-ui,sans-serif;gap:2px}
.dev i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px Georgia,serif;color:#241607;border:1px solid #000}
.dev small{font:9px system-ui,sans-serif;opacity:.6;font-weight:400}
.bar{height:6px;background:#150f08;border:1px solid #000;margin:2px 0 0;border-radius:3px;overflow:hidden;width:70px}.bar>i{display:block;height:100%;background:var(--gold)}
#win,#stPanel,#stList{scrollbar-width:thin;scrollbar-color:#9c7a3c #1a1208}
#toasts{right:44px;top:44px;display:flex;flex-direction:column;gap:5px;z-index:8;pointer-events:none;align-items:flex-end}
.toast{max-width:230px;padding:6px 10px;font:11.5px system-ui,sans-serif;background:linear-gradient(#4a3519,#2b1d0d);border:1.5px solid var(--gd);border-left:4px solid var(--gold);border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.5);animation:ti .25s ease}
@keyframes ti{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
#speed{display:flex;align-items:center;gap:3px}
#speed .pip{width:9px;height:18px;padding:0;background:#3b2c18;border:1px solid #000;border-radius:1px;cursor:pointer}
#speed .pip.on{background:var(--gold)}
.spd{width:20px;height:20px;font-size:12px;border-radius:50%}
@media (max-width:899px){.res.opt{display:none}}


/* ===== tema Nusantara: batik kawung, tumpal, bingkai emas, soga & merah bata ===== */
:root{--gold:#f0cf7a;--gd:#c99a3a;--paper:#f4e8c9;--bata:#7a1f14;--soga:#2a130b}

.wood{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g fill='none' stroke='%23d9a93a' stroke-opacity='.17' stroke-width='1'><ellipse cx='13' cy='6.5' rx='3.4' ry='6'/><ellipse cx='13' cy='19.5' rx='3.4' ry='6'/><ellipse cx='6.5' cy='13' rx='6' ry='3.4'/><ellipse cx='19.5' cy='13' rx='6' ry='3.4'/></g><circle cx='13' cy='13' r='1.2' fill='%23d9a93a' fill-opacity='.2'/></svg>"),linear-gradient(180deg,#3d1a10 0%,#21100a 100%);border:6px solid transparent;border-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><rect x='1.4' y='1.4' width='33.2' height='33.2' fill='none' stroke='%23d9a93a' stroke-width='1.3'/><rect x='4.2' y='4.2' width='27.6' height='27.6' fill='none' stroke='%23d9a93a' stroke-opacity='.4' stroke-width='.7'/><g><path d='M1 1h11v1.8H2.8V12H1z' fill='%23d9a93a'/><path d='M4.5 4.5l3 0-3 3z' fill='%23d9a93a'/><circle cx='6' cy='6' r='1.1' fill='%235a160e' stroke='%23d9a93a' stroke-width='.6'/></g><g transform='translate(36 0) scale(-1 1)'><path d='M1 1h11v1.8H2.8V12H1z' fill='%23d9a93a'/><path d='M4.5 4.5l3 0-3 3z' fill='%23d9a93a'/><circle cx='6' cy='6' r='1.1' fill='%235a160e' stroke='%23d9a93a' stroke-width='.6'/></g><g transform='translate(0 36) scale(1 -1)'><path d='M1 1h11v1.8H2.8V12H1z' fill='%23d9a93a'/><path d='M4.5 4.5l3 0-3 3z' fill='%23d9a93a'/><circle cx='6' cy='6' r='1.1' fill='%235a160e' stroke='%23d9a93a' stroke-width='.6'/></g><g transform='translate(36 36) scale(-1 -1)'><path d='M1 1h11v1.8H2.8V12H1z' fill='%23d9a93a'/><path d='M4.5 4.5l3 0-3 3z' fill='%23d9a93a'/><circle cx='6' cy='6' r='1.1' fill='%235a160e' stroke='%23d9a93a' stroke-width='.6'/></g></svg>") 12 / 6px round;box-shadow:0 5px 14px rgba(0,0,0,.6)}

.btn.on{background:linear-gradient(#f7de97,#b78428);color:#2a1008}

#top::after{content:'';position:absolute;left:0;right:0;bottom:-10px;height:9px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='9'><polygon points='0,0 18,0 9,9' fill='%23d9a93a'/><polygon points='3.6,0 14.4,0 9,5.4' fill='%235a160e'/><polygon points='6.8,0 11.2,0 9,2.4' fill='%23d9a93a'/></svg>") repeat-x;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
#crest{background:radial-gradient(circle at 40% 32%,#a22c1d,#4a0f08 78%);border:2px solid #140603;box-shadow:0 0 0 2px #d9a93a,0 0 0 4px #4a0f08,0 3px 9px rgba(0,0,0,.7);width:60px;height:60px;overflow:hidden}

#win .hd,#prov .hd,#stPanel .hd{background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g fill='none' stroke='%23d9a93a' stroke-opacity='.17' stroke-width='1'><ellipse cx='13' cy='6.5' rx='3.4' ry='6'/><ellipse cx='13' cy='19.5' rx='3.4' ry='6'/><ellipse cx='6.5' cy='13' rx='6' ry='3.4'/><ellipse cx='19.5' cy='13' rx='6' ry='3.4'/></g><circle cx='13' cy='13' r='1.2' fill='%23d9a93a' fill-opacity='.2'/></svg>"),linear-gradient(#942c1f,#561710);border-bottom:2px solid #d9a93a;box-shadow:0 2px 0 #140603}
#win .hd::after,#stPanel .hd::after{content:'';position:absolute;left:0;right:0;bottom:-8px;height:7px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='9'><polygon points='0,0 18,0 9,9' fill='%23d9a93a'/><polygon points='3.6,0 14.4,0 9,5.4' fill='%235a160e'/><polygon points='6.8,0 11.2,0 9,2.4' fill='%23d9a93a'/></svg>") repeat-x;background-size:14px 7px;opacity:.9;pointer-events:none}
#win .hd,#stPanel .hd{position:sticky;z-index:2}#stPanel .hd{position:relative}
#win h2,#stPanel h2,#prov h2{color:#f6dc8f;text-shadow:0 1px 0 #000,0 0 8px rgba(0,0,0,.6);letter-spacing:1px}
#win .sec{background:linear-gradient(90deg,#6a1a11,#3a0f09);color:#f0cf7a;border-top:1px solid rgba(217,169,58,.45);border-bottom:1px solid rgba(0,0,0,.6);letter-spacing:1.2px}
#win .sec::before{content:'◆ ';font-size:7px;vertical-align:1px;opacity:.8}
#win .r,#stPanel .r,.rowb{border-bottom:1px solid rgba(217,169,58,.16)}
.rowb.on{background:linear-gradient(#7a2a1a,#4a150c)}

<script>
const DATA = __MAP__;
const app = document.getElementById('app');
const cvs = document.getElementById('map'), mainCtx = cvs.getContext('2d');
let ctx = mainCtx;
const mmc = document.getElementById('mm'), mctx = mmc.getContext('2d');
const WATER = '#14405a', WATER_T = '#17475f';
const COL = { core:'#c04a36', vassal:'#e8b68a', rival:'#5f93b8' };
const TERR = { plains:'#9aaa58', jungle:'#3d6b3a', mountain:'#86714f', coast:'#c4b77a', sea:WATER };
const TERR_TXT = { plains:'Dataran', jungle:'Hutan lebat', mountain:'Pegunungan', coast:'Pesisir', sea:'Perairan' };
const ST_TXT = { core:'Inti Majapahit', vassal:'Mitra / tributari', rival:'Rival', indep:'Merdeka', foreign:'Kerajaan asing', sea:'Perairan' };
const WW = DATA.W, WH = DATA.H;
const provs = DATA.provinces.map(p => ({ ...p, path: new Path2D(p.d) }));
const nats = DATA.nations.map(n => ({ nat:n.nat, path:new Path2D(n.d) }));
const coast = new Path2D(DATA.coast);
const rivers = DATA.rivers.map(d => new Path2D(d)), lakes = DATA.lakes.map(d => new Path2D(d));

const byName = n => provs.find(p => p.n === n);
const hueOf = s => { let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))>>>0; return h%360; };
function natCol(nat) {
  if (nat === 'Majapahit') return COL.core; if (nat === 'Sunda') return COL.rival;
  let h = hueOf(nat); if (h < 28 || h > 335) h = (h + 70) % 360; if (h > 195 && h < 228) h = (h + 50) % 360;
  return `hsl(${h},46%,60%)`;
}
const natColor = {}; provs.forEach(p => { if (p.k === 'L' && !natColor[p.nat]) natColor[p.nat] = natCol(p.nat); });
const BASE_OWN = Object.fromEntries(provs.filter(p => p.k === 'L').map(p => [p.id, p.nat]));
let OWNR = { ...BASE_OWN }, CTRL = {};
function polFillRaw(p) { return p.k === 'S' ? WATER : (natColor[OWNR[p.id]] || '#888'); }
function polFill(p) { return p._pf || (p._pf = polFillRaw(p)); }
const HATCH = {};
function hatchFor(col) {
  if (HATCH[col]) return HATCH[col];
  const c = document.createElement('canvas'); c.width = c.height = 12; const g = c.getContext('2d');
  g.strokeStyle = col; g.globalAlpha = .85; g.lineWidth = 2.6; g.beginPath(); g.moveTo(-3, 12); g.lineTo(12, -3); g.moveTo(-3, 3); g.lineTo(3, -3); g.moveTo(9, 15); g.lineTo(15, 9); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.globalAlpha = 1; g.lineWidth = .8; g.beginPath(); g.moveTo(-3, 13); g.lineTo(13, -3); g.stroke();
  return HATCH[col] = ctx.createPattern(c, 'repeat');
}

let phase = 'start', selNat = null, G = null;
let rot = false, vw = 800, vh = 360, dpr = 1, minS = .3, maxS = 8, fitS = .3, raf = 0, inited = false;
let view = { s:1, tx:0, ty:0 }, mode = 'pol', selId = null;
const pat = {};

function toLocal(x, y) { return rot ? { x:y, y:window.innerWidth - x } : { x, y }; }

function layout() {
  const W = window.innerWidth, H = window.innerHeight;
  rot = H > W;
  vw = rot ? H : W; vh = rot ? W : H;
  app.style.width = vw + 'px'; app.style.height = vh + 'px';
  app.style.transform = rot ? `translateX(${W}px) rotate(90deg)` : 'none';
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  cvs.style.width = vw + 'px'; cvs.style.height = vh + 'px';
  cvs.width = Math.round(vw*dpr); cvs.height = Math.round(vh*dpr);
  fitS = Math.min(vw/WW, vh/WH); minS = fitS*.9; maxS = fitS*12;
}
const clampS = s => Math.min(maxS, Math.max(minS, s));
function clampView() {
  const mw = WW*view.s, mh = WH*view.s, m = 40;
  view.tx = mw <= vw ? (vw-mw)/2 : Math.min(m, Math.max(vw-mw-m, view.tx));
  view.ty = mh <= vh ? (vh-mh)/2 : Math.min(m, Math.max(vh-mh-m, view.ty));
}
function centerOn(wx, wy, s) { view.s = clampS(s); view.tx = vw/2 - wx*view.s; view.ty = vh/2 - wy*view.s; clampView(); request(); }
function zoomAt(x, y, ns) { ns = clampS(ns); const wx=(x-view.tx)/view.s, wy=(y-view.ty)/view.s; view.s = ns; view.tx = x-wx*ns; view.ty = y-wy*ns; clampView(); request(); }
const home = () => Math.max(fitS*1.5, vw/(WW*.4));
function request() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); drawMini(); }); }

function makePatterns() {
  const mk = (n, f) => { const c = document.createElement('canvas'); c.width = c.height = n; f(c.getContext('2d')); return ctx.createPattern(c, 'repeat'); };
  pat.noise = mk(128, c => { for (let i=0;i<4200;i++){ c.fillStyle = Math.random()<.5?'rgba(0,0,0,.26)':'rgba(255,240,200,.16)'; c.fillRect(Math.random()*128,Math.random()*128,1.4+Math.random(),1.4+Math.random()); }});
  pat.water = mk(96, c => { for (let i=0;i<800;i++){ c.fillStyle = 'rgba(150,215,240,'+(Math.random()*.10).toFixed(3)+')'; c.fillRect(Math.random()*96,Math.random()*96,2,1); }});
  pat.grain = mk(128, c => { for (let i = 0; i < 1500; i++) { c.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.6)' : 'rgba(255,246,222,.55)'; c.fillRect((Math.random()*128)|0, (Math.random()*128)|0, 1, 1); } });
  pat.hatch = mk(14, c => { c.strokeStyle='rgba(60,18,8,.35)'; c.lineWidth=2; c.beginPath(); c.moveTo(-3,14); c.lineTo(14,-3); c.moveTo(-3,3); c.lineTo(3,-3); c.moveTo(11,17); c.lineTo(17,11); c.stroke(); });
}

const placed = [];
function fits(x, y, w, h) {
  const r = [x-w/2, y-h/2, x+w/2, y+h/2];
  for (const q of placed) if (r[0]<q[2] && r[2]>q[0] && r[1]<q[3] && r[3]>q[1]) return false;
  placed.push(r); return true;
}
function label(t, x, y, fs, font, fill, halo, ls) {
  ctx.font = font; if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  const w = ctx.measureText(t).width;
  if (!fits(x, y, w + 4, fs + 3)) return false;
  ctx.lineJoin = 'round'; ctx.lineWidth = 2.6; ctx.strokeStyle = halo; ctx.strokeText(t, x, y);
  ctx.fillStyle = fill; ctx.fillText(t, x, y); return true;
}
function peaks(x, y, s) {
  const k = Math.min(1, Math.max(.6, s*1.6));
  ctx.fillStyle = 'rgba(66,45,24,.85)'; ctx.strokeStyle = 'rgba(255,236,190,.5)'; ctx.lineWidth = .8;
  for (const [dx,dy,r] of [[-8,4,1],[1,1,1.25],[9,6,.9]]) {
    const px=x+dx*k, py=y+dy*k, z=5*k*r;
    ctx.beginPath(); ctx.moveTo(px-z,py+z*.6); ctx.lineTo(px,py-z); ctx.lineTo(px+z,py+z*.6); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
function counter(x, y, txt, color) {
  const w = 24, h = 14;
  ctx.fillStyle = '#000'; ctx.fillRect(x-w/2-1.5, y-h/2-1.5, w+3, h+3);
  const g = ctx.createLinearGradient(0,y-h/2,0,y+h/2); g.addColorStop(0,'#f1d38a'); g.addColorStop(1,'#9c7a3c');
  ctx.fillStyle = g; ctx.fillRect(x-w/2-.5, y-h/2-.5, w+1, h+1);
  ctx.fillStyle = color; ctx.fillRect(x-w/2+1.5, y-h/2+1.5, 8, h-3);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 9px system-ui,sans-serif'; if ('letterSpacing' in ctx) ctx.letterSpacing='0px';
  ctx.textAlign = 'center'; ctx.fillText(txt, x+4, y+.5);
}

/* ===== tekstur medan & air (dibuat sekali saat memuat) ===== */
const TEX = { land:null, water:null, ready:false };
const TK = 1.2;
const LANDC = { plains:'#8fae55', jungle:'#43723a', mountain:'#86714f', coast:'#b8b479' };
const PERM = new Uint8Array(512), GR = new Float32Array(256);
function rng(seed) { let a = seed >>> 0; return () => (a = (a*1664525 + 1013904223) >>> 0) / 4294967296; }
(() => { const r = rng(7), p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = (r()*(i+1))|0; [p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) PERM[i] = p[i & 255]; for (let i = 0; i < 256; i++) GR[i] = r(); })();
function vn(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, X = xi & 255, Y = yi & 255;
  const a = GR[PERM[X + PERM[Y]]], b = GR[PERM[X + 1 + PERM[Y]]], c = GR[PERM[X + PERM[Y + 1]]], d = GR[PERM[X + 1 + PERM[Y + 1]]];
  const u = xf*xf*(3 - 2*xf), v = yf*yf*(3 - 2*yf);
  return a + (b - a)*u + (c - a)*v + (a - b - c + d)*u*v;
}
function fbm(x, y) { let a = .5, f = 1, s = 0; for (let o = 0; o < 5; o++) { s += a*vn(x*f, y*f); f *= 2.03; a *= .5; } return s; }
const mkc = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ===== tekstur: hanya hitung piksel daratan, noise dipakai ulang ===== */
function buildTextures() {
  const tw = Math.round(WW*TK), th = Math.round(WH*TK);
  const lw = Math.round(tw/9), lh = Math.round(th/9);
  const lo = mkc(lw, lh), lx = lo.getContext('2d'), mo = mkc(lw, lh), mx = mo.getContext('2d');
  for (const c of [lx, mx]) c.scale(lw/WW, lh/WH);
  lx.fillStyle = '#8c9a5c'; lx.fillRect(0, 0, WW, WH); mx.fillStyle = '#000'; mx.fillRect(0, 0, WW, WH);
  for (const p of provs) if (p.k === 'L') {
    lx.fillStyle = lx.strokeStyle = LANDC[p.t] || '#888'; lx.fill(p.path); lx.lineWidth = 3; lx.stroke(p.path);
    mx.fillStyle = mx.strokeStyle = p.t === 'mountain' ? '#f00' : p.t === 'jungle' ? '#0f0' : '#000'; mx.fill(p.path); mx.lineWidth = 3; mx.stroke(p.path);
  }
  // warna medan (frekuensi rendah, dipakai di mode Medan)
  const tc = mkc(tw, th), tx = tc.getContext('2d'); tx.imageSmoothingQuality = 'high'; tx.drawImage(lo, 0, 0, tw, th);
  tx.globalCompositeOperation = 'destination-in'; tx.save(); tx.scale(tw/WW, th/WH); tx.fill(coast, 'evenodd'); tx.restore();
  TEX.tint = tc;
  const mc = mkc(tw, th), mcx = mc.getContext('2d'); mcx.imageSmoothingQuality = 'high'; mcx.drawImage(mo, 0, 0, tw, th);
  const lmC = mkc(tw, th), lmx = lmC.getContext('2d'); lmx.scale(tw/WW, th/WH); lmx.fillStyle = '#000'; lmx.fill(coast, 'evenodd');
  const lm = lmx.getImageData(0, 0, tw, th).data, md = mcx.getImageData(0, 0, tw, th).data;
  TEX.lm = new Uint8Array(tw*th); for (let i = 0; i < tw*th; i++) TEX.lm[i] = lm[i*4 + 3];
  TEX.tw = tw; TEX.th = th;
  const bc = mkc(tw, th), bx = bc.getContext('2d'), img = bx.createImageData(tw, th), d = img.data;
  const H = new Float32Array(tw*th), MOT = new Float32Array(tw*th), JV = new Float32Array(tw*th);
  const F = .022, F1 = F*2.03, F2 = F1*2.03, F3 = F2*2.03;
  for (let y = 0, i = 0; y < th; y++) for (let x = 0; x < tw; x++, i++) {
    if (lm[i*4 + 3] < 8) continue;
    const m = md[i*4]/255, j = md[i*4 + 1]/255;
    const a0 = vn(x*F, y*F), a1 = vn(x*F1, y*F1), a2 = vn(x*F2, y*F2), a3 = vn(x*F3, y*F3);
    const n = .55*a0 + .28*a1 + .14*a2;
    let rg = 0;
    if (m > .02) rg = 1 - Math.abs(2*(vn(x*.03 + 50, y*.03 + 20)*.65 + vn(x*.06, y*.06)*.35) - 1);
    H[i] = n*.5 + m*(.95*rg + .35) + j*.12*n + 1e-4;
    MOT[i] = (a2 - .5)*.22 + (a3 - .5)*.08; JV[i] = a1;
  }
  const o = 2*tw + 2;
  for (let y = 2; y < th - 2; y++) for (let x = 2; x < tw - 2; x++) {
    const i = y*tw + x; if (!H[i]) continue;
    const m = md[i*4]/255, j = md[i*4 + 1]/255;

/* ================= TAHAP 3: kepemilikan, pasukan, perang, diplomasi ================= */
const LINK = {};
provs.forEach(p => { if (p.k === 'L') { LINK[p.id] = []; p.cp = new Path2D(p.cd || ''); p.edges = []; } });
for (const i in DATA.adj) for (const j of DATA.adj[i]) LINK[i].push({ to:j, strait:false });
for (const [a, b] of DATA.straits) { LINK[a].push({ to:b, strait:true }); LINK[b].push({ to:a, strait:true }); }
const EDGES = DATA.edges.map(([a, b, d]) => ({ a, b, path:new Path2D(d) }));

let OWNED = {};
function rebuildOwned() { OWNED = {}; for (const id in OWNR) (OWNED[OWNR[id]] ||= []).push(+id); }

const pairKey = (a, b) => a < b ? a + '|' + b : b + '|' + a;
const monthIdx = () => (G.y - 1350)*12 + G.mo;
const provDev = id => (G && G.pv[id]) ? G.pv[id].t + G.pv[id].p + G.pv[id].m : baseDev(PROV[id]).reduce((x, y) => x + y, 0);
const natDev = nat => (OWNED[nat] || []).reduce((a, id) => a + provDev(id), 0);

const alive = nat => (OWNED[nat] || []).length > 0;
const isMe = nat => G && nat === G.nat;
function capOf(nat) {
  const n = NATS[nat], list = OWNED[nat] || [];
  if (!list.length) return null;
  if (OWNR[n.capital.id] === nat) return n.capital;
  let best = PROV[list[0]]; for (const id of list) if (PROV[id].r < best.r || (PROV[id].r === best.r && provDev(id) > provDev(best.id))) best = PROV[id];
  return best;
}
const aiFl = nat => Math.max(2, Math.round(2 + natMan(nat)/4));
const techOf = nat => isMe(nat) ? G.tech[2] : 3;
const fortOf = id => PROV[id] === capOf(OWNR[id]) ? 3 : PROV[id].r === 1 ? 2 : 1;

/* ---------- hubungan ---------- */
function relGet(a, b) {
  const k = pairKey(a, b);
  if (G.rel[k] === undefined) {
    let v = (hv(k, 41) - 20) + (NATS[a].relig === NATS[b].relig ? 12 : 0);
    if (k === 'Majapahit|Sunda') v = -110;
    if (G.subj[a] === b || G.subj[b] === a) v = 60;
    G.rel[k] = v;
  }
  return G.rel[k];
}
const relAdd = (a, b, d) => { const k = pairKey(a, b); G.rel[k] = Math.max(-200, Math.min(200, relGet(a, b) + d)); };
const allied = (a, b) => G.al.includes(pairKey(a, b));
const married = (a, b) => G.mar.includes(pairKey(a, b));
const hasAccess = (who, owner) => G.acc.includes(owner + '>' + who);
const truceLeft = (a, b) => Math.max(0, (G.truce[pairKey(a, b)] || 0) - monthIdx());
const subjectOf = n => G.subj[n];
const subjectsOf = n => Object.keys(G.subj).filter(k => G.subj[k] === n && alive(k));

/* ---------- perang: struktur ---------- */
function sideOf(w, nat) { return w.att.includes(nat) ? 'att' : w.def.includes(nat) ? 'def' : null; }
function atWar(a, b) { if (a === b) return false; for (const w of G.wars) { const sa = sideOf(w, a), sb = sideOf(w, b); if (sa && sb && sa !== sb) return true; } return false; }
const warsOf = nat => G.wars.filter(w => sideOf(w, nat));
const sameSide = (a, b) => a === b || G.wars.some(w => sideOf(w, a) && sideOf(w, a) === sideOf(w, b));
function occVal(id, owner) { const tot = natDev(owner) || 1; let v = 100*provDev(id)/tot*0.95; if (PROV[id] === capOf(owner)) v *= 1.3; return v; }
function warScore(w) {          // sudut pandang penyerang, -100..100
  let sc = w.bp;
  for (const id in CTRL) {
    const o = OWNR[id], c = CTRL[id];
    if (o === c) continue;
    if (sideOf(w, o) === 'def' && sideOf(w, c) === 'att') sc += occVal(+id, o);
    else if (sideOf(w, o) === 'att' && sideOf(w, c) === 'def') sc -= occVal(+id, o);
  }
  return Math.max(-100, Math.min(100, Math.round(sc)));
}
function addLog(t) { G.log.unshift(`${G.d} ${MONTHS[G.mo]} ${G.y} · ${t}`); if (G.log.length > 30) G.log.pop(); }
function involvesMe(w) { return !!sideOf(w, G.nat); }

/* ---------- peristiwa (modal) ---------- */
function pushEvent(e) { G.ev.push(e); showEvent(); }
function showEvent() {
  const m = $('modal');
  if (G) G.ev = G.ev.filter(e => e.war === undefined || G.wars.some(w => w.id === e.war));
  if (!G || !G.ev.length) { m.classList.remove('open'); return; }
  const e = G.ev[0]; paused = true; updateTop();
  m.innerHTML = `<div class="mbox"><h3>${e.t}</h3><p>${e.x}</p><div class="mo${e.col ? ' col' : ''}">${e.o.map((o, i) => `<button class="btn ab" data-act="ev" data-i="${i}">${o[0]}</button>`).join('')}</div></div>`;
  m.classList.add('open');
}
const EVA = {
  ok: () => {},
  joinWar: a => { const w = G.wars.find(x => x.id === a.w); if (!w || sideOf(w, G.nat)) return; (a.s === 'att' ? w.att : w.def).push(G.nat); toast('Anda bergabung dalam perang.'); addLog(`Bergabung perang di sisi ${a.s === 'att' ? 'penyerang' : 'bertahan'}.`); },
  refuseWar: a => { G.prestige = Math.max(-100, G.prestige - 5); relAdd(G.nat, a.ally, -30); G.al = G.al.filter(k => k !== pairKey(G.nat, a.ally)); toast('Aliansi diputus karena menolak membantu.'); },
  gev: a => gevPick(a),
  acceptPeace: a => { const w = G.wars.find(x => x.id === a.w); if (w) applyPeace(w, a.winner, a.opts); },
};

/* ---------- pasukan ---------- */
function mkArmy(nat, regs, loc) { const a = { id:G.nid++, nat, regs, loc, path:[], prog:0 }; G.armies.push(a); return a; }
const armiesOf = nat => G.armies.filter(a => a.nat === nat);
const regsOf = nat => armiesOf(nat).reduce((s, a) => s + a.regs, 0);
const myArmies = () => armiesOf(G.nat);
function syncRegs() { G.regs = regsOf(G.nat); }
function armyName(a) { const L = armiesOf(a.nat); return `Pasukan ${L.indexOf(a) + 1}`; }
function stepDays(a, b) {
  const A = PROV[a], B = PROV[b], d = Math.hypot(A.lab[0] - B.lab[0], A.lab[1] - B.lab[1]);
  const tm = ({ plains:1, coast:1, jungle:1.45, mountain:1.7 })[B.t] || 1;
  let days = Math.max(4, Math.round(d/6*tm));
  const l = LINK[a].find(x => x.to === b); if (l && l.strait) days = Math.round(days*1.5) + 3;
  return days;
}
function access(nat, id) {
  const o = OWNR[id]; if (!o || o === nat) return true;
  if (atWar(nat, o)) return true; if (allied(nat, o) || sameSide(nat, o)) return true;
  if (hasAccess(nat, o)) return true; if (G.subj[nat] === o || G.subj[o] === nat) return true;
  return false;
}
function distMap(nat, from) {
  const dist = { [from]:0 }, prev = {}, open = [from], done = new Set();
  while (open.length) {
    let bi = 0; for (let i = 1; i < open.length; i++) if (dist[open[i]] < dist[open[bi]]) bi = i;
    const u = open.splice(bi, 1)[0]; if (done.has(u)) continue; done.add(u);
    for (const l of LINK[u]) {
      if (!access(nat, l.to)) continue;
      const nd = dist[u] + stepDays(u, l.to);
      if (dist[l.to] === undefined || nd < dist[l.to]) { dist[l.to] = nd; prev[l.to] = u; open.push(l.to); }
    }
  }
  return { dist, prev };
}
function pathTo(nat, from, to) {
  if (from === to) return [];
  const { dist, prev } = distMap(nat, from); if (dist[to] === undefined) return null;
  const p = []; let c = to; while (c !== from) { p.unshift(c); c = prev[c]; } return p;
}
function orderMove(a, to, quiet) {
  if (a.loc === to && !a.path.length) return false;
  const start = a.path.length && a.prog > 0 ? a.path[0] : a.loc;      // lanjutkan langkah yang sedang berjalan
  let p;
  if (a.path.length && a.prog > 0) { const r = pathTo(a.nat, a.path[0], to); p = r ? [a.path[0], ...r] : null; }
  else p = pathTo(a.nat, a.loc, to);
  if (!p || !p.length) { if (!quiet && isMe(a.nat)) toast('Tidak ada rute ke sana (butuh akses militer atau perang).'); return false; }
  if (!(a.path.length && a.prog > 0)) a.prog = 0;
  a.path = p; return true;
}
const hostile = (a, b) => a.nat !== b.nat && atWar(a.nat, b.nat);

function interceptArmies(arrived) {
  const movers=G.armies.filter(a=>a.path.length && !a.bt && a.regs>0);
  for (let i=0;i<movers.length;i++) for(let j=i+1;j<movers.length;j++) {
    const a=movers[i], b=movers[j];
    if(a.bt || b.bt || !a.path.length || !b.path.length || !hostile(a,b)) continue;
    if(a.path[0]!==b.loc || b.path[0]!==a.loc) continue;
    const pa=(a.prog+1)/stepDays(a.loc,a.path[0]), pb=(b.prog+1)/stepDays(b.loc,b.path[0]);
    if(pa+pb<1) continue;
    a.loc=b.loc; a.prog=b.prog=0; a.path=[]; b.path=[]; arrived.add(a.id);
    resolveBattles(arrived);
  }
}
function armiesDay() {
  const arrived = new Set();
  resolveBattles(arrived); // tangkap musuh sekotak sebelum keduanya bergerak
  interceptArmies(arrived);
  for (const a of G.armies) {
    if (!a.path.length || a.bt) continue;
    const nxt = a.path[0];
    if (!access(a.nat, nxt)) { a.path = []; a.prog = 0; if (isMe(a.nat)) toast(`Akses ke ${PROV[nxt].n} ditolak.`); continue; }
    a.prog++;
    if (a.prog >= stepDays(a.loc, nxt)) { a.loc = nxt; a.path.shift(); a.prog = 0; arrived.add(a.id); }
  }
  resolveBattles(arrived);
  battlesDay();
  sieges();
  if (G.d % 3 === 0) aiArmies();
  G.armies = G.armies.filter(a => a.regs > 0);
  if (G.sel && !G.armies.find(a => a.id === G.sel)) G.sel = null;
}
function powerOf(list, loc, defending) {
  let p = 0; for (const a of list) p += a.regs*(1 + .06*(techOf(a.nat) - 3));
  const t = PROV[loc].t; if (defending) p *= ({ mountain:1.25, jungle:1.1 })[t] || 1;
  return p;
}
function retreatArmy(a, from) {
  let best = null, bd = 1e9; const home = capOf(a.nat);
  for (const l of LINK[from]) {
    if (!access(a.nat, l.to) || (OWNR[l.to] !== a.nat && !sameSide(a.nat, OWNR[l.to]) && atWar(a.nat, OWNR[l.to]))) continue;
    if (G.armies.some(x => x.loc === l.to && hostile(x, a))) continue;
    const d = home ? Math.hypot(PROV[l.to].lab[0] - home.lab[0], PROV[l.to].lab[1] - home.lab[1]) : 0;
    const own = OWNR[l.to] === a.nat ? 0 : 200;
    if (d + own < bd) { bd = d + own; best = l.to; }
  }
  if (best === null) { a.regs = 0; return false; }
  a.loc = best; a.path = []; a.prog = 0; return true;
}
function siegeNeed(id, regs) { return Math.round((10 + 12*fortOf(id))*Math.max(.4, Math.min(1.4, 1/(.55 + .12*regs)))); }
function sieges() {
  const by = {}; for (const a of G.armies) if (!a.path.length) (by[a.loc] ||= []).push(a);
  for (const id in G.siege) if (!by[id]) delete G.siege[id];
  for (const loc in by) {
    const L = by[loc], owner = OWNR[loc], ctl = CTRL[loc] || owner;
    if (L.some(a => L.some(b => hostile(a, b)))) continue;
    const bes = L.filter(a => atWar(a.nat, ctl));
    if (!bes.length) { delete G.siege[loc]; continue; }
    const nat = bes[0].nat, regs = bes.filter(a => a.nat === nat).reduce((s, a) => s + a.regs, 0);
    const S = G.siege[loc] ||= { by:nat, days:0 };
    if (S.by !== nat) { S.by = nat; S.days = 0; }
    S.days++; S.need = siegeNeed(+loc, regs);
    if (S.days >= S.need) { delete G.siege[loc]; occupy(+loc, nat); }
  }
}
function occupy(id, nat) {
  const owner = OWNR[id];
  if (owner === nat || sameSide(nat, owner) && G.wars.some(w => sideOf(w, owner) && sideOf(w, owner) !== sideOf(w, CTRL[id] || owner))) delete CTRL[id];
  else CTRL[id] = nat;
  const msg = CTRL[id] ? `${PROV[id].n} (milik ${owner}) diduduki oleh ${nat}` : `${PROV[id].n} dibebaskan`;
  addLog(msg); if (isMe(nat) || isMe(owner)) toast(msg + '.');
  PROV[id]._pf = null; cacheVer++; request();
  if (isMe(owner) && CTRL[id]) { /* pendapatan hilang selama diduduki */ }
}

/* ---------- AI pasukan ---------- */
function aiArmies() {
  for (const a of G.armies) {
    if (isMe(a.nat) || a.path.length || (a.id + G.d) % 2) continue;
    if(G.subj[a.nat] && libertyDesire(a.nat)>=50)continue;
    const myWars = warsOf(a.nat);
    if (!myWars.length) {
      const h = capOf(a.nat); if (h && a.loc !== h.id && OWNR[a.loc] !== a.nat && !access(a.nat, a.loc)) orderMove(a, h.id, true);
      continue;
    }
    if (G.siege[a.loc] && G.siege[a.loc].by === a.nat) continue;
    const { dist } = distMap(a.nat, a.loc);
    let best = null, bs = 1e9;
    const myPow = powerOf([a], a.loc, false);
    for (const id in dist) {
      const pid = +id; if (pid === a.loc) continue;
      const ctl = CTRL[pid] || OWNR[pid];
      const enemyHere = G.armies.filter(x => x.loc === pid && atWar(a.nat, x.nat));
      const ep = powerOf(enemyHere, pid, true);
      const hostileTarget = atWar(a.nat, ctl) || enemyHere.length;
      if (!hostileTarget) continue;
      if (ep > myPow*1.1) continue;
      let sc = dist[id] + fortOf(pid)*6 - provDev(pid)*.25 + (enemyHere.length ? -8 : 0);
      if (OWNR[pid] === a.nat && CTRL[pid] && atWar(a.nat, CTRL[pid])) sc -= 15;
      if (G.siege[pid] && atWar(a.nat, G.siege[pid].by) && sameSide(a.nat, CTRL[pid] || OWNR[pid])) sc -= 20;
      if (sc < bs) { bs = sc; best = pid; }
    }
    if (best !== null) orderMove(a, best, true);
  }
}

/* ---------- perang: deklarasi & akhir ---------- */
function declareWar(att, def, cb) {
  const attacked=def; def=G.subj[def] || def;
  const w = { id:G.nid++, att:[att], def:[def], aL:att, dL:def, bp:0, cb, start:monthIdx(), ev:-99 };

    const atw = warsOf(n).length > 0, fl = Math.round(aiFl(n)*(atw ? 1.4 : 1)), have = regsOf(n);
    if (have < fl && Math.random() < (atw ? .8 : .35)) {

  }

    const mine = powerOf(armiesOf(n), capOf(n).id, false);

      if (t === G.nat && monthIdx() < 24) continue;

function onMapTap(p, x, y) {
  if (phase === 'start') { if (p && p.k === 'L') selectNation(OWNR[p.id]); return; }
  const bh = BT_HIT.slice().reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
  if (bh) { bpOpen(bh.bt.id, true); return; }
  const hit = ARM_HIT.slice().reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
  if (hit && isMe(hit.a.nat)) { if (G.sel === hit.a.id) deselectArmy(); else selectArmy(hit.a.id); return; }
  if (G.sel && p && p.k === 'L') {
    const a = G.armies.find(z => z.id === G.sel);
    if (a && p.id === a.loc && !a.path.length) { deselectArmy(); return; }
    if (a && (p.id !== a.loc || a.path.length)) { orderMove(a, p.id); renderWin(); request(); return; }
  }
  if (p) { G.sel = null; selId = p.id; winMode = 'prov'; winProv = p.id; renderWin(); request(); }
  else { G.sel = null; winMode = null; selId = null; renderWin(); request(); }

/* ---------- Tahap C: agama ---------- */
const RELS = {
  siwa:{ n:'Siwa-Buddha', g:'dharma' }, hindu:{ n:'Hindu', g:'dharma' }, mahayana:{ n:'Buddha Mahayana', g:'dharma' },
  thera:{ n:'Buddha Theravada', g:'dharma' }, islam:{ n:'Islam Sunni', g:'muslim' }, animis:{ n:'Animisme', g:'pagan' },
};
function relKey(s) { s = s || ''; return s.startsWith('Siwa') ? 'siwa' : s.startsWith('Hindu') ? 'hindu' : s === 'Buddha Mahayana' ? 'mahayana' : s === 'Buddha Theravada' ? 'thera' : s.startsWith('Islam') ? 'islam' : 'animis'; }
function fixRel() {
  if (!G.pr) { G.pr = {}; for (const p of provs) if (p.k === 'L') G.pr[p.id] = relKey(RELIG[p.nat]); }
  G.rs ||= relKey(NATS[G.nat].relig);
  if (relKey(NATS[G.nat].relig) !== G.rs) NATS[G.nat].relig = RELS[G.rs].n;
  G.miss ||= []; G.inst ||= {}; G.ideas ||= []; G.evx ||= {};
}
const relOf = id => (G.pr && G.pr[id]) || 'animis';
const relName = id => RELS[relOf(id)].n;
const tolTrue = () => 3 + (G.rs === 'siwa' || G.rs === 'hindu' ? 1 : 0) + modSum('tolT');
const tolHeretic = () => (G.rs === 'siwa' ? 1 : 0) + modSum('tolH');
const tolHeathen = () => -1 + modSum('tolN');
function tolOf(k) { return k === G.rs ? tolTrue() : RELS[k].g === RELS[G.rs].g ? tolHeretic() : tolHeathen(); }
function relFac(id) { if (!G || !G.pr) return 1; const k = relOf(id); if (k === G.rs) return 1; const t = tolOf(k); return t < 0 ? Math.max(.5, 1 + .1*t) : 1; }
function unity() {
  let a = 0, b = 0;
  for (const id in G.pv) {
    if (CTRL[id] && CTRL[id] !== G.nat) continue;
    const d = provDev(id), k = relOf(id); let c = 1;
    if (k !== G.rs) { const t = tolOf(k); c = t < 0 ? 0 : t === 0 ? .25 : t <= 1 ? .5 : t <= 2 ? .75 : 1; }
    a += d*c; b += d;
  }
  return b ? Math.round(100*a/b) : 100;
}
const stabCost = () => Math.round(100 * (1 + (100 - unity())/100));
function unrestOf(id) {
  const k = relOf(id); let u = 0;
  if (k !== G.rs) { const t = tolOf(k); u = t < 0 ? -t*1.25 : 0; }
  if (G.miss.some(m => m.pid === id)) u += 6;
  return Math.round(u*10)/10;
}
const misMaxR = () => 1 + (NATS[G.nat].ruler.a >= 5 ? 1 : 0);
const misStr = () => 2 + .5*Math.max(0, G.stab) + modSum('misn');
function sendMiss(id) {
  if (!G.pv[id] || relOf(id) === G.rs || G.miss.length >= misMaxR() || G.miss.some(m => m.pid === id)) return;
  G.miss.push({ pid:id, p:0 }); toast(`Misionaris dikirim ke ${PROV[id].n}.`);
}
function relRow(id) {
  const k = relOf(id); let st = '';
  if (G && G.pv[id]) st = k === G.rs ? ' · iman negara' : RELS[k].g === RELS[G.rs].g ? ' · bidaah' : ' · kafir';
  return row('Agama', RELS[k].n + st) + (G && G.pv[id] && k !== G.rs ? row('Keresahan', unrestOf(id)) : '');
}
function missRow(id) {
  if (relOf(id) === G.rs) return '';
  const m = G.miss.find(x => x.pid === id);
  if (m) return `<div class="r"><span>Misionaris · ${Math.floor(m.p)}%</span>${btn('Tarik', 'unmiss', { id })}</div>`;
  return `<div class="r"><span>Misionaris ${G.miss.length}/${misMaxR()} · +${misStr().toFixed(1)}%/bln</span>${btn('Kirim', 'miss', { id }, G.miss.length < misMaxR())}</div>`;
}
function chRel(k) {
  if (!RELS[k] || k === G.rs || G.mana[0] < 150) return;
  if (!Object.keys(G.pv).some(id => relOf(id) === k)) return;
  G.mana[0] -= 150; G.rs = k; NATS[G.nat].relig = RELS[k].n; G.miss = [];
  EF.stab(-2); addMod('chrel', 'Perubahan keyakinan', 24, { tax:-.10 });
  toast(`Agama negara kini ${RELS[k].n}.`); addLog(`Agama negara berganti menjadi ${RELS[k].n}.`);
}
function relMonth() {
  for (const m of G.miss.slice()) {
    if (!G.pv[m.pid] || relOf(m.pid) === G.rs) { G.miss.splice(G.miss.indexOf(m), 1); continue; }
    m.p += misStr() + (RELS[relOf(m.pid)].g === RELS[G.rs].g ? 1 : 0);
    if (m.p >= 100) { G.pr[m.pid] = G.rs; G.miss.splice(G.miss.indexOf(m), 1); toast(`${PROV[m.pid].n} kini memeluk ${RELS[G.rs].n}.`); addLog(`${PROV[m.pid].n} berpindah ke ${RELS[G.rs].n}.`); }
  }
  if (G.y >= 1380) {
    const ch = .004 * Math.min(3, 1 + (G.y - 1380)/60);
    for (const p of provs) {
      if (p.k !== 'L' || p.t !== 'coast' || G.pr[p.id] === 'islam' || G.pv[p.id]) continue;
      if ((LINK[p.id] || []).some(l => G.pr[l.to] === 'islam') && Math.random() < ch) G.pr[p.id] = 'islam';
    }
  }
}
function relHTML() {
  const un = unity(), tt = tolTrue(), th = tolHeretic(), tn = tolHeathen(), sg2 = v => (v >= 0 ? '+' : '') + v;
  let h = hd('Agama', RELS[G.rs].n) + `<div class="sec">Toleransi</div>` + row('Iman sendiri', sg2(tt)) + row('Bidaah (satu rumpun)', sg2(th)) + row('Kafir (lain rumpun)', sg2(tn))
    + `<div class="sec">Kesatuan agama</div>` + row('Kesatuan', un + '%') + row('Biaya stabilitas', '+' + (100 - un) + '%') + `<div class="sec">Penganut (perkembangan)</div>`;
  const by = {}; for (const id in G.pv) { if (CTRL[id] && CTRL[id] !== G.nat) continue; const k = relOf(id); by[k] = (by[k] || 0) + provDev(id); }
  for (const k in by) h += row(RELS[k].n + (k === G.rs ? ' ★' : ''), by[k]);
  h += `<div class="sec">Misionaris ${G.miss.length}/${misMaxR()}</div>`;
  for (const m of G.miss) h += `<div class="r"><span>${PROV[m.pid].n}</span><b>${Math.floor(m.p)}%</b></div>`;
  if (!G.miss.length) h += `<p class="note">Kirim dari jendela provinsi yang agamanya berbeda.</p>`;
  const ch = Object.keys(by).filter(k => k !== G.rs);
  if (ch.length) { h += `<div class="sec">Ganti agama negara</div>`; for (const k of ch) h += `<div class="r"><span>Jadi ${RELS[k].n}</span>${btn('150 ADM', 'chrel', { k }, G.mana[0] >= 150)}</div>`; }
  return h + `<p class="note">Toleransi negatif memotong pajak & produksi provinsi 10% per poin. Keresahan (+6 saat ada misionaris) baru memicu pemberontak di tahap berikutnya.</p>`;
}

     { l:'Usir para pendakwah', tip:'+3 prestise; pajak −3% selama 24 bulan', fx:() => { EF.prestige(3); EF.mod('usir', 'Pedagang tersinggung', 24, { tax:-.03 }); } },
     { l:'Undang ulama ke istana', tip:'Toleransi kafir +1 selamanya', fx:() => EF.mod('istana', 'Istana terbuka', -1, { tolN:1 }) }] });
function candIslam() { return Object.keys(G.pv).map(Number).filter(id => PROV[id].t === 'coast' && relOf(id) !== 'islam' && !(CTRL[id] && CTRL[id] !== G.nat) && (LINK[id] || []).some(l => G.pr[l.to] === 'islam')); }

/* ---------- Tahap D: teknologi, lembaga, ide ---------- */
const TL_MAX = 32;
const techYear = L => 1350 + 13*(L - 3);
const aiTech = () => 3 + Math.max(0, Math.floor((G.y - 1358)/14));
const INST = [
  { k:'pelayaran', n:'Pelayaran Jung', y:1400, org:'Majapahit', fx:{ prod:.10 }, d:'+10% produksi' },
  { k:'mesiu', n:'Meriam & Mesiu', y:1450, org:'Samudra', fx:{ mpmax:.10 }, d:'+10% tenaga & force limit' },
  { k:'pasar', n:'Pasar Samudra', y:1500, org:'Malayu', fx:{ tax:.10 }, d:'+10% pajak' },
];
const orgProv = nat => (NATS[nat] ? NATS[nat].capital : NATS.Majapahit.capital).id;
const instPen = () => .25 * INST.filter(I => G.inst[I.k] && G.inst[I.k].on && !G.inst[I.k].emb).length;
function instShare(k) {
  const S = G.inst[k]; if (!S) return 0; let a = 0, b = 0;
  for (const id in G.pv) { const d = provDev(id); b += d; if (S.emb || S.pv[id]) a += d; }
  return b ? a/b : 0;
}
function embCost(k) { let b = 0; for (const id in G.pv) b += provDev(id); return Math.max(20, Math.round(.8*b*(1 - instShare(k))*infMul())); }
function embrace(k) {
  const I = INST.find(x => x.k === k), S = G.inst[k], c = embCost(k);
  if (!I || !S || !S.on || S.emb || instShare(k) < .1 || G.treasury < c) return;
  G.treasury -= c; S.emb = true; addMod('inst_' + k, 'Lembaga ' + I.n, -1, I.fx); toast(`Lembaga ${I.n} diadopsi.`); addLog(`Mengadopsi lembaga ${I.n}.`);
}
function instMonth() {

const TRADE_NODES = [
 {id:'maluku',n:'Maluku',out:['sulawesi','jawa']},
 {id:'sulawesi',n:'Sulawesi',out:['jawa']},
 {id:'borneo',n:'Kalimantan',out:['jawa','malaka']},
 {id:'siam',n:'Siam–Champa',out:['malaka']},
 {id:'sumatra',n:'Sumatra',out:['malaka']},

 {id:'malaka',n:'Selat Malaka',out:[]},

const TRADE_BY_ID=Object.fromEntries(TRADE_NODES.map(n=>[n.id,n]));
function tradeNode(p) {
 const n=p.nat;
 if(['Bintan','Tumasik','Pahang','Kelantan','Kadaram','Langkasuka'].includes(n))return 'malaka';
 if(['Siam','Khmer','Champa','Tenasserim'].includes(n))return 'siam';
 if(['Minahasa','Gorontalo','Luwu','Makassar','Konawe','Banggai','Buton','Visayas','Mindanao','Sulu'].includes(n))return 'sulawesi';
 if(REGIONAL_STYLE.borneo.includes(n))return 'borneo';
 if(REGIONAL_STYLE.sumatra.includes(n))return 'sumatra';
 if(['Maloko','Halmahera','Sran','Ambon','Buru','Gurun','Kei','Aru','Sorong','Wanin','Mamberamo','Papua Tengah','Papua Timur','Papua Selatan'].includes(n))return 'maluku';

}
function fixTrade() {
 const home=tradeNode(capOf(G.nat)||NATS[G.nat].capital);
 G.trade ||= {home,merchants:[]};
 if(!TRADE_BY_ID[G.trade.home])G.trade.home=home;
 const seen=new Set();G.trade.merchants=(G.trade.merchants||[]).filter(m=>{
   if(!TRADE_BY_ID[m.node]||seen.has(m.node)||!['collect','steer'].includes(m.mode))return false;
   if(m.mode==='steer'&&m.node===G.trade.home){m.mode='collect';m.to=null;}
   if(m.mode==='steer'&&!TRADE_BY_ID[m.node].out.includes(m.to))return false;
   seen.add(m.node);m.left=Math.max(0,Number(m.left)||0);return true;

function tradeReach(node) {
 if(!TRADE_BY_ID[node])return false;

}
function tradeDay() { for(const m of G.trade?.merchants||[])if(m.left>0)m.left--; }
function tradeSnapshot() {
 const nodes=Object.fromEntries(TRADE_NODES.map(n=>[n.id,{local:0,incoming:0,total:0,powers:{},raw:{},collected:0,forwarded:0,retained:0,bonus:0,player:0,share:0}]));
 const incomes={},homes={};for(const n of Object.keys(NATS))if(alive(n))homes[n]=n===G.nat?G.trade.home:tradeNode(capOf(n));
 for(const p of provs) {
   if(p.k!=='L'||!OWNR[p.id])continue;
   const node=nodes[tradeNode(p)],owner=OWNR[p.id],controller=CTRL[p.id]||owner;
   const q=owner===G.nat?G.pv[p.id]:null,dev=q?[q.t,q.p,q.m]:baseDev(p),market=!!q?.bld.includes('pasar');
   const goods=goodsOf(p);
   if(goods!=='Emas')node.local+=(dev[1]+(market?1:0))*.2*(GOODS[goods]||2)/12;
   let power=(.2*(dev[0]+dev[1]+dev[2])+(p.t==='coast'?2:0)+(p.r===1?5:0))*(market?1.5:1);
   // Pendudukan meniadakan pengaruh pemilik; pengendali mendapat separuh.
   if(controller!==owner)power*=.5;
   node.raw[controller]=(node.raw[controller]||0)+power;
 }
 const merchants=Object.fromEntries((G.trade.merchants||[]).filter(m=>!m.left).map(m=>[m.node,m]));
 let playerIncome=0;
 for(const def of TRADE_NODES) {
   const node=nodes[def.id],m=merchants[def.id];node.powers={...node.raw};
   if(m)node.powers[G.nat]=(node.powers[G.nat]||0)+2;
   if(m?.mode==='collect'&&def.id!==G.trade.home)node.powers[G.nat]=(node.powers[G.nat]||0)*.5;
   const totalPower=Object.values(node.powers).reduce((a,b)=>a+b,0);
   node.total=node.local+node.incoming;
   node.share=totalPower?(node.powers[G.nat]||0)/totalPower:0;
   const steering=[];
   for(const [n,power] of Object.entries(node.powers)) {
     const share=totalPower?power/totalPower:0;
     const collect=homes[n]===def.id || n===G.nat&&m?.mode==='collect';
     if(collect) {
       const value=node.total*share;node.collected+=value;
       const efficiency=n===G.nat?Math.max(0,1.2+.02*(G.tech[1]-3)+modSum('trade')):1.2;
       const income=value*efficiency*(n===G.nat&&m?.mode==='collect'?1.1:1);
       incomes[n]=(incomes[n]||0)+income;if(n===G.nat){node.player=income;playerIncome+=income;}
     }else steering.push({n,power});
   }
   const uncollected=Math.max(0,node.total-node.collected);
   if(!def.out.length){node.retained=uncollected;continue;}
   const weights=Object.fromEntries(def.out.map(to=>[to,0]));
   for(const entry of steering) {
     const to=entry.n===G.nat&&m?.mode==='steer'?m.to:def.out[0];weights[to]+=entry.power;
   }
   const weight=Object.values(weights).reduce((a,b)=>a+b,0);
   if(!weight)weights[def.out[0]]=1;
   const denominator=weight||1;
   for(const to of def.out) {
     const value=uncollected*weights[to]/denominator;
     const bonus=m?.mode==='steer'&&m.to===to ? value*.05 : 0;
     nodes[to].incoming+=value+bonus;node.forwarded+=value;node.bonus+=bonus;
   }
 }
 return {nodes,incomes,income:playerIncome};
}

  const s0 = view.s, w0x = (vw/2 - view.tx)/view.s, w0y = (vh/2 - view.ty)/view.s, t0 = performance.now();
  (function step(t) {
    let k = Math.min(1, (t - t0)/450); k = 1 - Math.pow(1 - k, 3);
    const ss = s0 + (s - s0)*k, cx = w0x + (wx - w0x)*k, cy = w0y + (wy - w0y)*k;
